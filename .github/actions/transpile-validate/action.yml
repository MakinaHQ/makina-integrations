name: Transpile and Validate Calibers
description: >-
  Transpiles each given caliber, diffs the output against its newest existing
  rootfile, and runs `check` plus the on-chain validators for whichever
  calibers actually changed. Leaves a __ci_generated__.toml temp file in each
  processed caliber's rootfiles/ directory — callers own renaming/deleting it.

inputs:
  calibers:
    description: Newline-separated "machine/chain" pairs to process.
    required: true
  etherscan-api-key:
    required: true
  alchemy-api-key:
    required: true
  transpiler-version:
    description: Pinned MakinaHQ/transpiler release tag to download.
    required: false
    default: v0.2.4
  transpiler-sha256:
    description: >-
      Expected SHA256 of transpiler-x86_64-unknown-linux-gnu.tar.xz for
      transpiler-version. Pinned HERE, in this repo, on purpose — see the
      download step. Update both inputs together when bumping the transpiler.
    required: false
    default: 9b42296ed74ec9a0830bd0e1f1724e730de30405ba7fae8f96b505bde2a76054

outputs:
  changed-calibers:
    description: >-
      Newline-separated "machine/chain" pairs whose transpiled output differs
      from their newest existing rootfile.
    value: ${{ steps.diff.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Download prebuilt transpiler
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TRANSPILER_VERSION: ${{ inputs.transpiler-version }}
        EXPECTED_SHA256: ${{ inputs.transpiler-sha256 }}
      run: |
        set -euo pipefail
        asset="transpiler-x86_64-unknown-linux-gnu.tar.xz"
        dest="$RUNNER_TEMP/transpiler-$TRANSPILER_VERSION"
        mkdir -p "$dest"

        # Download the asset only. We deliberately do NOT fetch the upstream
        # .sha256 and verify against it: that file lives in the same release as
        # the asset, so anyone who can replace one can replace both, and the
        # check would only prove the download wasn't corrupted in transit.
        #
        # GitHub release assets are mutable (`gh release upload --clobber`) and
        # tags are movable, so pinning a tag name alone does not pin content.
        # This binary produces every rootfile in the repo, and rootfiles-guard's
        # "byte-identical to fresh transpiler output" check re-runs this same
        # binary — so a substituted transpiler would make that proof vacuous
        # rather than catching anything. Pin the digest HERE instead: this file
        # is on main, behind required review, so changing it is visible.
        gh release download "$TRANSPILER_VERSION" \
          --repo MakinaHQ/transpiler \
          --pattern "$asset" \
          --dir "$dest" \
          --clobber

        echo "${EXPECTED_SHA256}  ${asset}" > "$dest/expected.sha256"
        if ! (cd "$dest" && sha256sum -c expected.sha256); then
          echo "::error::Transpiler asset digest mismatch for $TRANSPILER_VERSION."
          echo "::error::Expected $EXPECTED_SHA256"
          echo "::error::Got      $(cd "$dest" && sha256sum "$asset" | cut -d' ' -f1)"
          echo "::error::Either the upstream release asset was replaced, or the pinned digest is stale after a version bump. Do NOT update the digest without establishing why the bytes changed."
          exit 1
        fi

        tar -xJf "$dest/$asset" -C "$dest"

        bin="$dest/transpiler-x86_64-unknown-linux-gnu/transpiler"
        chmod +x "$bin"

        echo "TRANSPILER_BIN=$bin" >> "$GITHUB_ENV"
        echo "Resolved transpiler version: $TRANSPILER_VERSION"
        echo "Transpiler binary: $bin"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Transpile each caliber and diff against its newest existing rootfile
      id: diff
      shell: bash
      env:
        CALIBERS: ${{ inputs.calibers }}
      run: |
        set -euo pipefail
        changed=()
        failed=()
        while IFS= read -r pair; do
          [ -z "$pair" ] && continue
          machine="${pair%%/*}"
          chain="${pair#*/}"
          dir="machines/$machine/$chain"
          caliber="$dir/caliber.yaml"
          mkdir -p "$dir/rootfiles"
          tmp="$dir/rootfiles/__ci_generated__.toml"

          lite=""
          if grep -q 'makina_lite_module' "$caliber"; then lite="--lite"; fi
          echo "Transpiling $caliber $lite"
          if ! "$TRANSPILER_BIN" -i "$caliber" -o "$tmp" -t "token-lists/prod-token-list.json" $lite; then
            echo "::error file=$caliber::Transpile failed for $pair"
            failed+=("$pair")
            continue
          fi

          newest=$(cd "$dir/rootfiles" && ls -1 | grep -E '^[0-9]{8}' | LC_ALL=C sort | tail -n 1 || true)
          if [ -z "$newest" ] || ! diff -q "$dir/rootfiles/$newest" "$tmp" > /dev/null 2>&1; then
            echo "  -> changed (vs '${newest:-<none>}')"
            changed+=("$pair")
          else
            echo "  -> unchanged (matches $newest)"
          fi
        done <<< "$CALIBERS"

        {
          echo "changed<<TRANSPILE_VALIDATE_EOF"
          if [ "${#changed[@]}" -gt 0 ]; then
            printf '%s\n' "${changed[@]}"
          fi
          echo "TRANSPILE_VALIDATE_EOF"
        } >> "$GITHUB_OUTPUT"

        if [ "${#failed[@]}" -gt 0 ]; then
          echo ""
          echo "::error::The following calibers failed to transpile:"
          printf '  %s\n' "${failed[@]}"
          echo ""
          echo "Every caliber must transpile before a release can regenerate rootfiles."
          exit 1
        fi

    - name: Run transpiler checks and on-chain validators for changed calibers
      shell: bash
      env:
        CHANGED: ${{ steps.diff.outputs.changed }}
        ETHERSCAN_API_KEY: ${{ inputs.etherscan-api-key }}
        ALCHEMY_API_KEY: ${{ inputs.alchemy-api-key }}
      run: |
        set -euo pipefail
        rootfiles=()
        while IFS= read -r pair; do
          [ -z "$pair" ] && continue
          machine="${pair%%/*}"
          chain="${pair#*/}"
          dir="machines/$machine/$chain"
          caliber="$dir/caliber.yaml"
          tmp="$dir/rootfiles/__ci_generated__.toml"

          lite=""
          if grep -q 'makina_lite_module' "$caliber"; then lite="--lite"; fi
          echo "Running transpiler check for $caliber $lite"
          "$TRANSPILER_BIN" -i "$caliber" -t "token-lists/prod-token-list.json" $lite check --github-errors

          rootfiles+=("$tmp")
        done <<< "$CHANGED"

        if [ "${#rootfiles[@]}" -eq 0 ]; then
          echo "No changed calibers — skipping check and validators."
        else
          uv run python -m unittest tests.test_validate_token_chains
          uv run python scripts/validate_token_chains.py "${rootfiles[@]}"

          uv run --with 'web3==7.14.1' --with pyyaml python -m unittest tests.test_validate_open_positions
          uv run --with 'web3==7.14.1' --with pyyaml python -m unittest tests.test_validate_base_tokens
          uv run --with 'web3==7.14.1' --with pyyaml python scripts/validate_open_positions.py "${rootfiles[@]}"
          uv run --with 'web3==7.14.1' --with pyyaml python scripts/validate_base_tokens.py "${rootfiles[@]}"
        fi
