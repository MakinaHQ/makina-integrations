# Validates that every open on-chain Caliber position has accounting in newly
# added rootfiles. The workflow runs only trusted base-revision code; fork data is
# downloaded as allowlisted TOML/YAML input after an environment reviewer approves.

name: Open Positions

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-inputs:
    name: Detect rootfile validation inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rootfiles: ${{ steps.classify.outputs.rootfiles }}
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Classify changed data files
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/materialize_pr_validation_inputs.py classify \
            --repository "${{ github.repository }}" \
            --pull-number "${{ github.event.pull_request.number }}"

  validate-open-positions:
    name: Validate open positions coverage in latest added rootfiles
    needs: detect-inputs
    if: needs.detect-inputs.outputs.rootfiles == 'true'
    environment: pr-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Materialize trusted rootfile inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/materialize_pr_validation_inputs.py materialize \
            --repository "${{ github.repository }}" \
            --pull-number "${{ github.event.pull_request.number }}" \
            --head-repository "${{ github.event.pull_request.head.repo.full_name }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --destination "$RUNNER_TEMP/pr-validation-inputs" \
            --rootfiles

      - name: Validate latest added rootfiles against live Caliber positions
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_PR_VALIDATION_KEY }}
        run: |
          find "$RUNNER_TEMP/pr-validation-inputs/machines" -path '*/rootfiles/*.toml' -type f -print0 |
            xargs -0 --no-run-if-empty uv run --with 'web3==7.14.1' --with pyyaml python scripts/validate_open_positions.py
