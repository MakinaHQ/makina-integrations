# Runs the validator integration tests that need a live RPC endpoint.
#
# These cannot live in `Validator Tests`: that workflow runs on `pull_request`
# and executes fork-authored test code, so it must never hold a secret. Here the
# job runs only from the default branch and explicitly checks out that trusted
# ref. The `pr-validation` reviewer gate is an acceptable cost for reaching the
# API key.
#
# REQUIRE_LIVE_RPC_TESTS makes the RPC-backed tests fail instead of skip, so this
# workflow cannot report success while quietly exercising nothing.

name: Validator Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-integration-tests:
    name: Run validator integration tests against live RPC
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: pr-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run RPC-backed validator tests
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          REQUIRE_LIVE_RPC_TESTS: "1"
        run: |
          set -euo pipefail
          uv run --with 'web3==7.14.1' --with pyyaml python -m unittest \
            tests.test_validate_open_positions -v
