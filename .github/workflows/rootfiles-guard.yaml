name: Rootfiles Guard

# Enforces the release-generated-rootfiles model: no human PR may add or
# modify a rootfile. Rootfiles are produced by publishing a GitHub Release
# (see release.yaml) and land on main via the release bot's own PR. That
# PR's added/modified rootfiles are re-verified here in "verify mode": they
# must be byte-identical to fresh transpiler output, or this check fails
# even for the bot's own branch.
#
# See docs/superpowers/specs/2026-07-24-release-generated-rootfiles-design.md

on:
  pull_request:

permissions:
  contents: read

jobs:
  # NOTE: this job id is the required-status-check context string configured in
  # the repository ruleset for `main`. Renaming it silently makes this guard
  # non-blocking — update the ruleset in the same change if you ever rename it.
  rootfiles-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect added/modified rootfiles and PR identity
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
        run: |
          set -euo pipefail
          # --no-renames is load-bearing: git's default rename detection reports a
          # delete+add pair of near-identical rootfiles (any two rootfiles are
          # highly similar TOML) as a single "R" status, which --diff-filter=AM
          # excludes. Without --no-renames, a deleted-and-replaced rootfile is
          # invisible to this detector and the guard silently passes it through.
          # Exclude deprecated paths: in git pathspec, * matches / (unlike shell glob),
          # so 'machines/*/*/rootfiles/*.toml' also catches deeper paths like
          # machines/.deprecated/ctfeth/mainnet/rootfiles/20250922-aave.toml.
          # machines/.deprecated/** is out of CI scope and inert; this exclusion
          # keeps it from blocking its own PR.
          FILES=$(git diff --no-renames --name-only --diff-filter=AM "origin/$BASE_REF" -- 'machines/*/*/rootfiles/*.toml' ':(exclude)machines/.deprecated/**')

          if [ -z "$FILES" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "calibers=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "files<<ROOTFILES_GUARD_FILES_EOF"
              echo "$FILES"
              echo "ROOTFILES_GUARD_FILES_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "count=$(echo "$FILES" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

            CALIBERS=$(echo "$FILES" | awk -F/ '{print $2"/"$3}' | sort -u)
            {
              echo "calibers<<ROOTFILES_GUARD_CALIBERS_EOF"
              echo "$CALIBERS"
              echo "ROOTFILES_GUARD_CALIBERS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          if [[ "$HEAD_REF" == release/rootfiles/* && -n "$RELEASE_BOT_LOGIN" && "$PR_AUTHOR" == "$RELEASE_BOT_LOGIN" ]]; then
            echo "is_bot_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_bot_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pass — no rootfiles touched
        if: steps.detect.outputs.count == 0
        run: echo "No rootfiles added or modified. Pass."

      - name: Reject — human PRs must not add or modify rootfiles
        if: steps.detect.outputs.count > 0 && steps.detect.outputs.is_bot_pr == 'false'
        env:
          FILES: ${{ steps.detect.outputs.files }}
        run: |
          echo "The following rootfiles were added or modified by this PR:"
          echo "$FILES"
          echo ""
          echo "Rootfiles are generated by publishing a GitHub Release, not authored by hand."
          echo "See README.md and docs/superpowers/specs/2026-07-24-release-generated-rootfiles-design.md."
          exit 1

      - name: Verify mode — re-transpile the release bot PR's calibers
        # NOTE: this step's `changed-calibers` output is intentionally unused
        # for the pass/fail decision below. It only decides which calibers get
        # `check` + on-chain validators run against them inside the composite
        # action. The guard's actual accept/reject decision is the explicit,
        # path-exact comparison in the step below, since `changed-calibers`
        # (diffed against each directory's *newest* file) says nothing about
        # whether the paths this PR actually touched were ever checked at all.
        if: steps.detect.outputs.count > 0 && steps.detect.outputs.is_bot_pr == 'true'
        id: verify
        uses: ./.github/actions/transpile-validate
        with:
          calibers: ${{ steps.detect.outputs.calibers }}
          etherscan-api-key: ${{ secrets.ETHERSCAN_API_KEY }}
          alchemy-api-key: ${{ secrets.ALCHEMY_API_KEY }}

      - name: Reject — bot PR must touch only reproducible, correctly-named rootfiles
        if: steps.detect.outputs.count > 0 && steps.detect.outputs.is_bot_pr == 'true'
        env:
          FILES: ${{ steps.detect.outputs.files }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          fail() {
            echo "$1"
            echo ""
            echo "Two things cause a bot PR to fail this check:"
            echo "  1. Caliber source landed on main after this release was cut, so these"
            echo "     rootfiles are now stale. Re-publish the release to regenerate them."
            echo "  2. The rootfiles (or this PR's branch) were modified after the release"
            echo "     workflow generated them — including pushes made after the PR was opened."
            echo ""
            echo "Either way this PR must not merge as-is."
            exit 1
          }

          # (a) A genuine release PR touches nothing but rootfiles — release.yaml's
          # commit step only ever does `git add -- "${RENAMED[@]}"`. Recompute the
          # PR's FULL changed-file list, not just the rootfiles glob the detect step
          # filters on, so a push can't smuggle source changes in alongside a
          # byte-matching rootfile.
          ALL_FILES=$(git diff --no-renames --name-only --diff-filter=AMD "origin/$BASE_REF")
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ ! "$f" =~ ^machines/[^/]+/[^/]+/rootfiles/[^/]+\.toml$ ]]; then
              fail "This PR touches a non-rootfile path: $f"
            fi
          done <<< "$ALL_FILES"

          # Build the touched-rootfile list into an array (bash 3.2-compatible:
          # no mapfile/readarray).
          touched=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            touched+=("$f")
          done <<< "$FILES"

          # (b) Every touched rootfile must use the release naming convention: an
          # 8-digit date (%Y%m%d) plus sanitized tag slug, exactly what
          # release.yaml's "Compute release identifiers" step produces. This
          # regex and that date format are coupled — changing one without the
          # other makes this guard reject the release bot's own output.
          for f in "${touched[@]}"; do
            name=$(basename "$f")
            if [[ ! "$name" =~ ^[0-9]{8}-[a-z0-9][a-z0-9-]*\.toml$ ]]; then
              fail "Rootfile name does not match the release naming convention: $f"
            fi
          done

          # (c) A release adds exactly one new rootfile per changed caliber. More
          # than one touched rootfile for the same machine/chain means something
          # other than the release workflow produced this diff.
          dupes=$(printf '%s\n' "${touched[@]}" | awk -F/ '{print $2"/"$3}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            fail "More than one touched rootfile for the same caliber: $dupes"
          fi

          # (d) Every touched rootfile must be byte-identical to fresh transpiler
          # output for its caliber — the re-verification this guard exists for.
          for f in "${touched[@]}"; do
            machine=$(echo "$f" | awk -F/ '{print $2}')
            chain=$(echo "$f" | awk -F/ '{print $3}')
            tmp="machines/$machine/$chain/rootfiles/__ci_generated__.toml"
            if [ ! -f "$tmp" ]; then
              fail "No fresh transpiler output for $f (expected $tmp) — did this caliber fail to transpile?"
            fi
            if ! diff -q "$f" "$tmp" > /dev/null 2>&1; then
              fail "Rootfile does not match fresh transpiler output: $f"
            fi
          done

          echo "All touched rootfiles are correctly named, one per caliber, and byte-identical to fresh transpiler output. Pass."

      - name: Clean up generated temp rootfiles
        if: always()
        run: find machines -name '__ci_generated__.toml' -delete
