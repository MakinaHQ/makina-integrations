name: Transpiler

# Validates that a PR's source (caliber.yaml, instructions, blueprints,
# blueprints-x, token-lists) transpiles cleanly and passes `check` plus the
# on-chain validators. Nothing is committed here — rootfiles are only ever
# produced by a release (release.yaml). Rootfiles must never be added or
# modified in a PR; rootfiles-guard.yaml enforces that separately.
#
# See docs/superpowers/specs/2026-07-24-release-generated-rootfiles-design.md

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # NOTE: this job id is the required-status-check context string configured in
  # the repository ruleset for `main`. It deliberately has no display `name:` —
  # a required check keyed on a prose display name silently stops matching if
  # anyone edits that name, which would make this gate non-blocking while still
  # appearing green. Renaming this job id means updating the ruleset in the
  # same change.
  transpile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Runs BEFORE (and independently of) the affected-set computation, and
      # unconditionally: these tests guard the scoping rule itself, including that
      # every shared source directory a caliber depends on is covered by
      # GLOBAL_PREFIXES. An uncovered directory makes the affected set come back
      # empty, so a test that only ran when the set was non-empty would be silent
      # in exactly the case it exists to catch.
      - name: Test affected-caliber scoping
        run: uv run python -m unittest tests.test_compute_affected_calibers

      # Also unconditional, and for the same reason: these guard invariants that
      # nothing else in CI would notice.
      #
      #   test_uniswap_x_filler_contract — the Uniswap-X filler's runtime ABI.
      #     Slot indices come from the DECLARATION ORDER of a blueprint's
      #     `input_slots:` block, so an innocuous-looking reorder silently breaks
      #     every filler on the chain while still transpiling cleanly. Also pins
      #     canonical action names and that parking appears once per caliber
      #     (it is keyed by stable label, so once per stock would collide).
      #
      #   test_machine_manifest — machine manifests restate addresses that live in
      #     the calibers they point at. Nothing else compares the two: the
      #     transpiler never reads config.toml, and both on-chain validators bail
      #     on makina_lite_module calibers before reaching it.
      #
      # Both are pure-source: no RPC, no secrets, no transpiler. They must not be
      # gated on the affected set — a manifest can drift from a caliber that this
      # PR did not touch.
      - name: Test filler contract and machine manifests
        run: |
          uv run --with pyyaml python -m unittest \
            tests.test_uniswap_x_filler_contract \
            tests.test_machine_manifest

      - name: Compute affected calibers
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Scope to the calibers this PR's diff could affect.
            CHANGED_FILES=()
            while IFS= read -r changed; do
              [ -n "$changed" ] && CHANGED_FILES+=("$changed")
            done < <(git diff --name-only "origin/$BASE_REF")

            if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
              CALIBERS=""
            else
              CALIBERS=$(uv run python scripts/compute_affected_calibers.py "${CHANGED_FILES[@]}")
            fi
          else
            # workflow_dispatch has no base ref to diff against, so validate every
            # caliber — the same sweep a release performs, but committing nothing.
            CALIBERS=$(uv run python scripts/compute_affected_calibers.py --all)
          fi

          if [ -z "$CALIBERS" ]; then
            echo "calibers=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "calibers<<TRANSPILER_CALIBERS_EOF"
              echo "$CALIBERS"
              echo "TRANSPILER_CALIBERS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Transpile and validate
        if: steps.affected.outputs.calibers != ''
        uses: ./.github/actions/transpile-validate
        with:
          calibers: ${{ steps.affected.outputs.calibers }}
          etherscan-api-key: ${{ secrets.ETHERSCAN_API_KEY }}
          alchemy-api-key: ${{ secrets.ALCHEMY_API_KEY }}

      - name: Skip — no calibers to validate
        if: steps.affected.outputs.calibers == ''
        run: echo "No calibers to validate."

      - name: Clean up generated temp rootfiles
        if: always()
        run: find machines -name '__ci_generated__.toml' -delete
