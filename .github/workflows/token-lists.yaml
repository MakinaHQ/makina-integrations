# Validates changed token list data against live ERC-20 metadata via Alchemy.
#
# This is deliberately a pull_request_target workflow: it checks out only the
# trusted base SHA and materializes an allowlisted subset of fork data through the
# GitHub API. It never checks out or executes fork code.

name: Token Lists

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-inputs:
    name: Detect token list validation inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      token_lists: ${{ steps.classify.outputs.token_lists }}
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Classify changed data files
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/materialize_pr_validation_inputs.py classify \
            --repository "${{ github.repository }}" \
            --pull-number "${{ github.event.pull_request.number }}"

  validate-token-lists:
    name: Validate changed token lists
    needs: detect-inputs
    if: needs.detect-inputs.outputs.token_lists == 'true'
    environment: pr-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Materialize trusted token list inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/materialize_pr_validation_inputs.py materialize \
            --repository "${{ github.repository }}" \
            --pull-number "${{ github.event.pull_request.number }}" \
            --head-repository "${{ github.event.pull_request.head.repo.full_name }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --destination "$RUNNER_TEMP/pr-validation-inputs" \
            --token-lists

      - name: Validate token lists against live ERC-20 metadata
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_PR_VALIDATION_KEY }}
        run: |
          find "$RUNNER_TEMP/pr-validation-inputs/token-lists" -maxdepth 1 -type f -name '*.json' -print0 |
            xargs -0 --no-run-if-empty uv run python scripts/validate_token_lists.py
