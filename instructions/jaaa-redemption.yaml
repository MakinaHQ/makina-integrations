# JAAA async redeem-out (dusd, mainnet) — DECOMPOSED base-token design.
#
# Dispose of JAAA back to USDC through the Centrifuge V3 ERC-7540 AsyncVault
# (pool 281474976710663), across the operator-settled asynchronous gap:
#
#   MANAGEMENT request_redeem: JAAA leaves the caliber into the pool escrow — ESCROWED, not
#     burned. affected_tokens=[JAAA]; the registry-value drop is offset by the pending term
#     rising, so the paired ACCOUNTING keeps NAV continuous.
#   MANAGEMENT claim_redeem: the operator has revoked the shares and reserved USDC; this
#     releases it. affected_tokens=[USDC].
#   ACCOUNTING account_redeem_pending: values convertToAssets(pendingRedeemRequest) +
#     maxWithdraw.
#
# Pairs with instructions/jaaa-swap-in.yaml; see that file's header for the GO-LIVE
# prerequisites (hook whitelist, JAAA base-token registration) and the hook-gating
# operational invariant. They apply identically here and are NOT repeated.
#
# ## No share approval on request_redeem — and that is structural, not observational
# AsyncRequestManager.requestRedeem moves the shares via BalanceSheet.transferSharesFrom ->
# ShareToken.authTransferFrom -> _transferFrom, whose allowance path is guarded by
# `if (from != sender)`. With owner == msg.sender == caliber, sender == from and the branch is
# skipped: no allowance is read or consumed. An approve leg here would be dead code.
#
# ## Settlement is NOT a caliber instruction
# Between request_redeem and claim_redeem the pool operator must call approveRedeems and then
# revokeShares/notifyRedeem. The caliber cannot self-settle and cannot bound the price it
# settles at — redeemPrice is written by the operator AFTER our request is mined. Observed
# mainnet latency on JAAA was ~6.5h, but nothing on-chain guarantees it. This is counterparty
# risk bounded by position sizing, not by a call.

# 1/4 - MANAGEMENT: request redemption of an exact JAAA amount
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.JAAA}" # JAAA (leaving; pending term rises)
  instruction:
    label: "JAAA Redemption Request"
    path: "../../../blueprints/jaaa-swap/withdraw.yaml:request_redeem"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

# 2/4 - MANAGEMENT: request redemption of a bps fraction of the caliber's JAAA balance
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.JAAA}" # JAAA (leaving; pending term rises)
  instruction:
    label: "JAAA Redemption Request (relative)"
    path: "../../../blueprints/jaaa-swap/withdraw.yaml:request_redeem_relative"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

# 3/4 - MANAGEMENT: claim the USDC the operator has already reserved in the pool escrow
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.USDC}" # USDC (arriving; claimable term falls)
  instruction:
    label: "JAAA Redemption Claim"
    path: "../../../blueprints/jaaa-swap/withdraw.yaml:claim_redeem"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

# 4/4 - ACCOUNTING: redeem-side in-flight value.
# affected_tokens is [USDC], NOT [JAAA] — the same deliberate deviation
# blueprints/prime-swap/withdraw.yaml makes. The blueprint pushes the SHARE-denominated
# pendingRedeemRequest through convertToAssets before summing it with the already-USDC
# maxWithdraw, so the slot is USDC-denominated; declaring [JAAA] would inflate it by the
# share premium (~4.7%). NAV continuity across request_redeem holds only if the registry's
# JAAA rate adapter derives from the vault's convertToAssets — see jaaa-swap-in.yaml prereq 2a.
- is_debt: false
  instruction_type: "ACCOUNTING"
  affected_tokens:
    - "${token_list.mainnet.USDC}" # USDC — converted pending + maxWithdraw are both USDC-denominated
  instruction:
    label: "JAAA Redemption Request"
    path: "../../../blueprints/jaaa-swap/account.yaml:account_redeem_pending"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
