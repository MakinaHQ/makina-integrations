# JAAA synthetic swap-in (dusd, mainnet) — DECOMPOSED base-token design.
#
# Acquire JAAA from USDC through the Centrifuge V3 ERC-7540 AsyncVault (pool
# 281474976710663). JAAA is a registered caliber base token, so held JAAA is valued natively
# by the registry and the ACCOUNTING leg reports ONLY the in-flight value.
#
# Split into two positions — jaaa-swap-in.yaml / jaaa-redemption.yaml, mirroring
# prime-swap-in.yaml / prime-redemption.yaml — because the deposit-side and redeem-side
# in-flight terms are independent and each position carries exactly one ACCOUNTING leg.
#
# Unlike PRIME (synchronous ERC4626), acquisition here is ASYNCHRONOUS: the USDC leaves in
# one transaction and the JAAA arrives in another hours later, with the mint happening in the
# operator's transaction. Hence three MANAGEMENT legs (request absolute / request relative /
# claim) instead of one swap leg. See blueprints/jaaa-swap/deposit.yaml for the lifecycle.
#
# GO-LIVE GOVERNANCE PREREQUISITES (outside these files, one-time, BOTH required):
#
#   1. HOOK WHITELIST — THE LONG POLE, AND IT IS NOT CODE. START IT FIRST.
#      The caliber 0xD1A1C248B253f1fc60eACd90777B9A63F8c8c1BC must be a member on the JAAA
#      restriction hook 0x3C5E7B28c4fF6F0bc8d9A9587992E96401e680A7. Today
#      isPermissioned(caliber) is false and EVERY call reverts, transfers included. This is a
#      KYC/ops process with the pool operator and it will outlast the code review.
#
#   2. JAAA BASE-TOKEN REGISTRATION.
#      a. Deploy a JAAA/USDC rate adapter. It MUST derive from the vault's own
#         convertToAssets — an independent feed makes the registry price and the accounting
#         price disagree, and NAV steps on every request.
#      b. OracleRegistry.setFeedRoute(JAAA, adapter, 87000, USDC/USD feed, 87000) on
#         0xC388B72AB90Be82B230D919F9C05c87F9397f485.
#      c. Caliber.addBaseToken(JAAA), sent from the dusd riskManagerTimelock
#         0x38542447c49D24e617fc06113295D7AaA3BEc4b6.
#      setFeedRoute MUST precede addBaseToken. Until both are done, accounting cannot value
#      JAAA and affected_tokens=[JAAA] reverts InvalidAffectedToken.
#
# OPERATIONAL INVARIANT: the four CLAIMABLE getters short-circuit to 0 when the hook
# membership check fails (the pending* getters do not), so losing membership while a
# claimable amount is outstanding collapses the ACCOUNTING term and drops NAV until
# membership is restored. Keep the caliber's hook membership live.

# 1/4 - MANAGEMENT: request an async deposit of an exact USDC amount.
# affected_tokens=[USDC] — USDC leaves the caliber balance and the deposit-side pending term
# rises by the same amount, so the paired ACCOUNTING leg keeps NAV continuous.
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.USDC}" # USDC (leaving; pending term rises)
  instruction:
    label: "JAAA Swap In"
    path: "../../../blueprints/jaaa-swap/deposit.yaml:request_deposit"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

# 2/4 - MANAGEMENT: request an async deposit of a bps fraction of the caliber's USDC balance
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.USDC}" # USDC (leaving; pending term rises)
  instruction:
    label: "JAAA Swap In (relative)"
    path: "../../../blueprints/jaaa-swap/deposit.yaml:request_deposit_relative"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

# 3/4 - MANAGEMENT: claim the JAAA the operator has already issued into the pool escrow.
# affected_tokens=[JAAA] — JAAA arrives in the caliber balance (valued natively by the
# registry) and the claimable term falls by the same amount.
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.JAAA}" # JAAA (arriving; claimable term falls)
  instruction:
    label: "JAAA Swap In Claim"
    path: "../../../blueprints/jaaa-swap/deposit.yaml:claim_deposit"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

# 4/4 - ACCOUNTING: deposit-side in-flight value.
# affected_tokens is [USDC], NOT [JAAA]: both terms the blueprint sums are USDC-denominated,
# and the Caliber prices each reserved slot via getPrice(affectedToken, accountingToken).
# Declaring [JAAA] would inflate a USDC amount by the share premium. Held JAAA is NOT
# reported here — the blueprint never reads balanceOf, which is what prevents double-counting.
- is_debt: false
  instruction_type: "ACCOUNTING"
  affected_tokens:
    - "${token_list.mainnet.USDC}" # USDC — the in-flight terms are USDC-denominated (see above)
  instruction:
    label: "JAAA Swap In"
    path: "../../../blueprints/jaaa-swap/account.yaml:account_deposit_pending"
    inputs:
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
