# Morpho Vault V2 curation for one vault managed by a Safe+MakinaLiteModule.
#
# Expected position vars:
#   label:         string   display label for the vault
#   vault_address: address  Morpho Vault V2 contract under curation

- name: morpho_vault_v2_curator_submit_call
  is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens: []
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho-vault-v2-curation/curator.yaml:submit_curator_call"
    inputs:
      vault_address:
        type: "address"
        value: ${position.vault_address}

