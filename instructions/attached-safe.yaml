# The attached Safe (docs/attached-safe/README.md): its own harvest-only position in the caliber,
# holding the one-off `create`. Any position that uses the Safe needs this one in the caliber.
#
# Caliber config: caliber_address, key_value_store_address, boolean_helper_address,
#   caliber_helper_address, attached_safe_address, attached_safe_salt,
#   attached_safe_kv_key (keccak256("makina.attached-safe")).

- is_debt: false
  instruction_type: "HARVEST"
  affected_tokens: []
  instruction:
    label: "Attached Safe"
    path: "../../../blueprints/safe/lifecycle.yaml:create"
    inputs:
      boolean_helper_address:
        type: "address"
        value: "${config.boolean_helper_address}"
      caliber_helper_address:
        type: "address"
        value: "${config.caliber_helper_address}"
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      attached_safe_kv_key:
        type: "bytes32"
        value: "${config.attached_safe_kv_key}"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      attached_safe_address:
        type: "address"
        value: "${config.attached_safe_address}"
      salt:
        type: "bytes32"
        value: "${config.attached_safe_salt}"
