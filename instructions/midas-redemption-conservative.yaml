# Generic Midas Redemption Vault — async, admin-settled redemption of an mToken into a
# stablecoin tokenOut, with conservative pending accounting.
#
# MANAGEMENT legs are identical to instructions/midas-redemption.yaml (same actions,
# same single KV key, one in-flight request per position). The only difference is the
# ACCOUNTING leg: midas-redemption.yaml reports the raw escrowed amount via
# account.yaml:account, whereas this caps it at min(request-time, current) mToken rate
# via account-conservative.yaml:account. Use it when the mToken rate can move materially
# between request and settlement and you would rather understate than overstate NAV.
# Migrating either way is a path swap plus the extra mtoken_data_feed_address var.
#
# Exit sizing is constrained by two independent 1-mToken minimums, neither guarded
# on-chain — see the header of blueprints/midas/withdraw.yaml.
#
# Expected caliber vars (per-position):
#   label:                     string   — friendly label (e.g. "mWIN Redemption")
#   redeemer_address:          address  — Midas redemption vault
#   mtoken_address:            address  — mToken redeemed; MUST be a machine base token
#   token_out_address:         address  — stablecoin the admin will settle in
#   mtoken_data_feed_address:  address  — MUST equal <redeemer>.mTokenDataFeed()
#   kv_storage_key:            bytes32  — unique per position
#
# Expected config:
#   key_value_store_address

# MANAGEMENT — request_redemption (absolute mToken amount)
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.mtoken_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/midas/withdraw.yaml:request_redemption"
    inputs:
      redeemer_address:
        type: "address"
        value: ${position.redeemer_address}
      mtoken_address:
        type: "address"
        value: ${position.mtoken_address}
      token_out_address:
        type: "address"
        value: ${position.token_out_address}
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      kv_storage_key:
        type: "bytes32"
        value: ${position.kv_storage_key}

# MANAGEMENT — request_redemption_relative (bps of caliber's mToken balance)
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.mtoken_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/midas/withdraw.yaml:request_redemption_relative"
    inputs:
      redeemer_address:
        type: "address"
        value: ${position.redeemer_address}
      mtoken_address:
        type: "address"
        value: ${position.mtoken_address}
      token_out_address:
        type: "address"
        value: ${position.token_out_address}
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      kv_storage_key:
        type: "bytes32"
        value: ${position.kv_storage_key}

# ACCOUNTING — value the in-flight request at min(request-time, current) rate,
# and reset the KV key once it is no longer Pending-and-ours.
- is_debt: false
  instruction_type: "ACCOUNTING"
  affected_tokens:
    - ${position.mtoken_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/midas/account-conservative.yaml:account"
    inputs:
      redeemer_address:
        type: "address"
        value: ${position.redeemer_address}
      mtoken_data_feed_address:
        type: "address"
        value: ${position.mtoken_data_feed_address}
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      kv_storage_key:
        type: "bytes32"
        value: ${position.kv_storage_key}
