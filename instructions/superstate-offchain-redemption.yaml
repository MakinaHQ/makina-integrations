# Superstate off-chain redemption (docs/superstate-offchain/README.md):
#   redeem -> Superstate pays the stablecoin to the attached Safe -> settle.
# Needs the caliber's Attached Safe position (attached-safe.yaml).
#
# Position vars: label, fund_token, stablecoin, claim_kv_key.
# Caliber config: see attached-safe.yaml.

# Burn fund tokens; the claim grows (fund-token units).
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.fund_token}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/superstate/redeem.yaml:redeem"
    inputs:
      boolean_helper_address:
        type: "address"
        value: "${config.boolean_helper_address}"
      caliber_helper_address:
        type: "address"
        value: "${config.caliber_helper_address}"
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      attached_safe_kv_key:
        type: "bytes32"
        value: "${config.attached_safe_kv_key}"
      claim_kv_key:
        type: "bytes32"
        value: ${position.claim_kv_key}
      attached_safe_address:
        type: "address"
        value: "${config.attached_safe_address}"
      fund_token:
        type: "address"
        value: ${position.fund_token}

# Pull the stablecoin payout from the Safe and close the claim, in one tx.
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.stablecoin}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/superstate/settle.yaml:settle"
    inputs:
      boolean_helper_address:
        type: "address"
        value: "${config.boolean_helper_address}"
      caliber_helper_address:
        type: "address"
        value: "${config.caliber_helper_address}"
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      attached_safe_kv_key:
        type: "bytes32"
        value: "${config.attached_safe_kv_key}"
      claim_kv_key:
        type: "bytes32"
        value: ${position.claim_kv_key}
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      attached_safe_address:
        type: "address"
        value: "${config.attached_safe_address}"
      delivery_token:
        type: "address"
        value: ${position.stablecoin}
      calldata_encoder_address:
        type: "address"
        value: "${config.calldata_encoder_address}"

# The claim, in its own token. Exactly one affected token.
- is_debt: false
  instruction_type: "ACCOUNTING"
  affected_tokens:
    - ${position.fund_token}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/superstate/account.yaml:account"
    inputs:
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      claim_kv_key:
        type: "bytes32"
        value: ${position.claim_kv_key}
