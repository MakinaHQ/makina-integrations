# Superstate off-chain subscription (docs/superstate-offchain/README.md):
#   subscribe -> Superstate mints the fund token to the attached Safe -> settle.
# Needs the caliber's Attached Safe position (attached-safe.yaml).
#
# Position vars: label, fund_token, stablecoin, deposit_address, claim_kv_key.
# Caliber config: see attached-safe.yaml.

# Stablecoin to Superstate; the claim grows (stablecoin units).
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.stablecoin}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/superstate/subscribe.yaml:subscribe"
    inputs:
      boolean_helper_address:
        type: "address"
        value: "${config.boolean_helper_address}"
      caliber_helper_address:
        type: "address"
        value: "${config.caliber_helper_address}"
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      attached_safe_kv_key:
        type: "bytes32"
        value: "${config.attached_safe_kv_key}"
      claim_kv_key:
        type: "bytes32"
        value: ${position.claim_kv_key}
      attached_safe_address:
        type: "address"
        value: "${config.attached_safe_address}"
      stablecoin:
        type: "address"
        value: ${position.stablecoin}
      deposit_address:
        type: "address"
        value: ${position.deposit_address}

# Pull the fund tokens from the Safe and close the claim, in one tx.
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.fund_token}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/superstate/settle.yaml:settle"
    inputs:
      boolean_helper_address:
        type: "address"
        value: "${config.boolean_helper_address}"
      caliber_helper_address:
        type: "address"
        value: "${config.caliber_helper_address}"
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      attached_safe_kv_key:
        type: "bytes32"
        value: "${config.attached_safe_kv_key}"
      claim_kv_key:
        type: "bytes32"
        value: ${position.claim_kv_key}
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      attached_safe_address:
        type: "address"
        value: "${config.attached_safe_address}"
      delivery_token:
        type: "address"
        value: ${position.fund_token}

# The claim, in its own token. Exactly one affected token.
- is_debt: false
  instruction_type: "ACCOUNTING"
  affected_tokens:
    - ${position.stablecoin}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/superstate/account.yaml:account"
    inputs:
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      claim_kv_key:
        type: "bytes32"
        value: ${position.claim_kv_key}
