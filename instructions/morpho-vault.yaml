# Generic Morpho vault template, for both Morpho Vault V1 and V2.
# Five ERC-4626 actions (deposit, account, redeem, relative redeem, withdraw),
# without emergency redemption. Requires `unsigned_math_helper_address`.
# Use morpho-vault-v1.yaml or morpho-vault-v2.yaml to add the emergency leg.
- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.asset_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho/deposit.yaml:deposit_vault"
    inputs:
      asset_address:
        type: "address"
        value: ${position.asset_address}
      vault_address:
        type: "address"
        value: ${position.vault_address}
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

- is_debt: false
  instruction_type: "ACCOUNTING"
  affected_tokens:
    - ${position.asset_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho/account.yaml:account_vault"
    inputs:
      vault_address:
        type: "address"
        value: ${position.vault_address}
      subject:
        type: "address"
        value: "${config.caliber_address}"

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.asset_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho/withdraw.yaml:redeem_vault"
    inputs:
      vault_address:
        type: "address"
        value: ${position.vault_address}
      receiver_address:
        type: "address"
        value: "${config.caliber_address}"

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.asset_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho/withdraw.yaml:redeem_vault_relative"
    inputs:
      vault_address:
        type: "address"
        value: ${position.vault_address}
      receiver_address:
        type: "address"
        value: "${config.caliber_address}"
      unsigned_math_helper:
        type: "address"
        value: "${config.unsigned_math_helper_address}"

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.asset_address}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho/withdraw.yaml:withdraw_vault"
    inputs:
      vault_address:
        type: "address"
        value: ${position.vault_address}
      receiver_address:
        type: "address"
        value: "${config.caliber_address}"
