  3_blueprint:
    status: completed
    timestamp: "2026-05-15T00:00:00Z"
    artifacts:
      - blueprints/midas-mglobal-redemption/withdraw.yaml
      - blueprints/midas-mglobal-redemption/account.yaml
      - machines/dusd/mainnet/instructions/midas-mglobal-redemption.yaml
    notes: |
      Created a new top-level blueprint protocol dir (midas-mglobal-redemption)
      rather than extending blueprints/midas/, because the redemption vault has
      a fundamentally different (async, admin-settled) flow than the deposit
      vault that blueprints/midas/deposit.yaml targets. This mirrors how
      blueprints/royco-v1/, blueprints/morpho-loop/, etc. split off from their
      simpler base counterparts.

      Blueprint highlights:
        - withdraw.yaml exposes two actions: redeem_request (absolute mGLOBAL
          amount) and redeem_request_relative (bps of caliber's mGLOBAL
          balance). Both:
            1. Read KV sentinel; revert via boolean_helper.revertIfFalse if
               non-zero (one-in-flight invariant).
            2. Read currentRequestId() (pre-increment value = id to be assigned).
            3. Add 1 (id-0 sentinel offset) → kv_value_to_store.
            4. context_helper.msgSender() → caliber_address.
            5. (relative only) balanceOf + mulDiv to derive amount.
            6. mGLOBAL.approve(vault, amount).
            7. vault.redeemRequest(USDC, amount, caliber_address).
            8. kv.set(key, kv_value_to_store).
        - account.yaml reads kv → max(stored,1)-1 to recover requestId without
          underflow on the "no request" case (which then reads the zero-init
          redeemRequests(0) struct; the is_pending mask filters it out).
          Extracts (sender, status, amountMToken, mTokenRate) from the tuple
          via caliber_helper.extractElementFromStaticTuple, computes
          is_pending = (status == 0) AND (sender != 0) (using bytes32_helper.eq
          on the sender field for the address-zero check), casts that bool to
          a 0/1 uint mask via math_helper.ternary, multiplies the stored-rate
          value by the mask, and writes new_kv = stored_sentinel * mask to KV
          (no-op on Pending; reset to 0 on Processed/Canceled/zero-init —
          satisfies the user-requested housekeeping reset).
        - Reserved_slots returns [value_usd18, UINT256_MAX] matching the
          infinifi/account.yaml convention.

      Critical design points reflected in header comments:
        - ID-0 sentinel: KV stores requestId + 1 because the vault's first
          request gets id 0 (Counters pre-increment, confirmed in
          execution-withdraw.md).
        - One-in-flight invariant: vault permits multiple concurrent Pending
          requests per caller (verified); blueprint enforces the invariant
          via the KV sentinel check.
        - Status enum CORRECTED to {Pending=0, Processed=1, Canceled=2} (no
          None) — sender != address(0) used to distinguish "real" Pending
          from a zero-init slot, per the contract's own _validateRequest.
        - Valuation uses the STORED mTokenRate from the Request struct, NOT
          a live mTokenDataFeed call (the live feed currently reverts with
          "DF: feed is unhealthy" on mainnet; the stored snapshot is the
          conservative best estimate and is immune to feed health).
        - Accounting writes back to KV every call (1 SSTORE, no-op when
          Pending, reset to 0 otherwise) — explicitly requested.
        - Header comments call out: (1) feed unhealthy will block submission
          until Midas restores feed health, (2) selector 0x15571a04 is
          currently per-selector paused on mainnet, (3) greenlist
          requirements for both caliber and vault.

      Instruction file machines/dusd/mainnet/instructions/midas-mglobal-redemption.yaml
      hard-codes the addresses (per the CLAUDE.md rule on protocol-specific
      addresses not going in caliber.yaml config) and binds:
        - vault_address: 0xA0Fc8BDFb1E6a705C1375810989B1d70a982b01B
        - mtoken_address: 0x7433806912Eae67919e66aea853d46Fa0aef98A8
        - token_out_address: USDC 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48
        - kv_store_address: ${config.key_value_store_address}
                            (dusd uses 0xa81fC382489F9560211AB15aD87f001b98C92E91)
        - kv_storage_key: 0x3d2572d8cf9d8f1fb2d01586929e412a44b570bd84dabd8ea5bf29175e81abc7
                          (keccak256("makina.mainnet.midas.mglobal-redemption"))
      The instruction exposes the two MANAGEMENT actions (redeem_request,
      redeem_request_relative) and the ACCOUNTING action. affected_tokens lists
      only mGLOBAL — USDC settlement is delivered out-of-band by admin and
      tracked by the caliber's native asset registry.

      This instruction is intentionally machine-specific rather than general
      because the mGLOBAL redemption vault is a singleton (no multiple
      deployments to parameterize). The /compile validation is left to the
      parent orchestrator per the agent contract.
