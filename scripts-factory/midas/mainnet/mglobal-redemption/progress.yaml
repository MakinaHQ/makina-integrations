# Intent - set at Stage 0, immutable
intent:
  pool_id: "mglobal-redemption"
  pool_name: "Midas mGLOBAL Redemption Vault (with Aave)"
  protocol: "midas"
  chain: "mainnet"
  machine: "dusd"
  actions: [withdraw, account]
  base_tokens:
    - address: "0x7433806912Eae67919e66aea853d46Fa0aef98A8"
      symbol: "mGLOBAL"
      decimals: 18
      index: 0
  context: |
    Withdraw-only integration on the existing Midas mGLOBAL redemption vault.
    Proxy (operational): 0xA0Fc8BDFb1E6a705C1375810989B1d70a982b01B
    Implementation: 0xf687E76e3d62d62fE6F6A7f66ce9faE21df6438d (MGlobalRedemptionVaultWithAave)

    ## Async two-step request flow (NOT instant)
    Use `redeemRequest(tokenOut, amountMTokenIn, recipient)` — NOT `redeemInstant`.
    This is admin-settled: the caliber calls redeemRequest now, escrowing mGLOBAL
    in the vault; admin later calls `approveRequest(id, newRate)` which pushes
    USDC directly to `recipient` (set the caliber as recipient). No on-chain
    claim function — funds appear in caliber wallet at admin settlement time.

    ## Token configuration (verified on-chain 2026-05-15)
    - mToken (mGLOBAL): 0x7433806912Eae67919e66aea853d46Fa0aef98A8 (18 dec)
    - tokenOut: ONLY USDC (0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48)
    - tokensConfig[USDC].fee = 0           → zero per-token fee
    - tokensConfig[USDC].stable = true     → tokenOutRate fixed at 1e18 (STABLECOIN_RATE)
    - tokensConfig[USDC].dataFeed = 0x3aAc6fd73fA4e16Ec683BD4aaF5Ec89bb2C0EdC2
    - minAmount = 0                         → no minimum
    - instantFee = 50 (0.5%)                → NOT applied on request flow (isInstant=false)
    - requestRedeemer: 0xaB9dA7953D82d81006639A6f87883d59594918b9
    - mTokenDataFeed: 0xb468A6F63868cB6C6D99105EDfbe73d6B21f139E
    - currentRequestId: 0 (vault is new, no requests yet)

    Net: user receives (amountMTokenIn * newMTokenRate) / 1e18 USDC at settlement,
    less truncation to 6 decimals. Zero fee.

    ## KV-store request tracking (architectural pattern)
    Store the in-flight `requestId` in KV; allow only ONE request in flight per
    caliber. Pattern is analogous to blueprints/infinifi/withdraw.yaml +
    blueprints/infinifi/account.yaml which use the same KV-store helper.

    Withdraw action ("redeem_request"):
      1. kv.get(key) — revert if != 0 (one-in-flight enforcement)
      2. read currentRequestId() on vault → next_id (this will be assigned next)
      3. approve(vault, amountMTokenIn) on mGLOBAL
      4. redeemRequest(USDC, amountMTokenIn, caliber_address) on vault
      5. kv.set(key, next_id)
    The trick: capture next_id BEFORE calling redeemRequest, since redeemRequest
    increments currentRequestId atomically using the pre-increment value.

    Account action (CORRECTED after Stage 1b — see functions.md):
      1. kv.get(key) → stored_id_plus_one  (see "ID-0 sentinel" below)
      2. read redeemRequests(stored_id) → (sender, tokenOut, status, amountMToken, mTokenRate, tokenOutRate)
      3. ACTUAL RequestStatus enum: {Pending=0, Processed=1, Canceled=2} — NO None variant
      4. "Request exists & is pending" requires BOTH status==0 AND sender != address(0)
         (status==0 alone is ambiguous because Solidity zero-initialises the slot)
      5. If pending: value = amountMToken * mTokenRate_stored / 1e18
         IMPORTANT: use the STORED mTokenRate from the Request struct, NOT a live
         mTokenDataFeed read — the live feed currently reverts ("DF: feed is
         unhealthy"). Stored rate is the snapshot taken at request time and is
         the conservative best estimate. (Admin can settle at a different rate
         later via approveRequest, but we report based on snapshot.)
      6. If not pending: reset kv; value = 0. Per-caliber USDC accounting catches
         the settled amount once admin pushes it.
      7. The unbound mGLOBAL balance is accounted by the caliber's native asset
         registry — do NOT double-count it here.

    ## ID-0 sentinel (CRITICAL — discovered Stage 1b)
    currentRequestId is a Counters.Counter starting at 0. The contract uses
    pre-increment: `requestId = currentRequestId.current(); currentRequestId.increment();`
    So the FIRST request ever made gets id=0. Since currentRequestId is currently 0,
    the caliber's first withdraw will land on id 0. This breaks "KV == 0 means
    no request in flight". Resolution options for the blueprint-writer to pick:
      (a) Store (requestId + 1) in KV. Sentinel: KV==0 → no request. Cleanest.
      (b) Store raw id, disambiguate by reading redeemRequests(0).sender on every
          accounting call. Costs an extra SLOAD but no encoding gymnastics.
    Recommendation: (a). Document the +1 offset clearly.

    ## Risks to document (not blockers)
    - Admin can `rejectRequest` → status=Canceled and escrowed mGLOBAL is NOT
      auto-refunded. After our KV reset we lose tracking; admin must manually
      `withdrawToken` and return funds. Off-chain monitoring required.
    - `approveRequest` is NOT gated by variationTolerance; admin can settle at
      any rate. We use current NAV in accounting as conservative best estimate.

    ## Reference helpers (existing in this repo)
    - context_helper:  0x0f431322E1fF2500D4C5a4E090A7Da7344F953BE (msgSender, blockTimestamp)
    - math_helper:     0x3D623B199E290358416415eA7e05B635E442e3c0 (mulDiv, eq, add, scaleAmount)
    - boolean_helper:  0x00c93e3b09Ca2f544487d4298339765EadCD8353 (revertIfFalse, revertIfTrue)
    - KV store: per-caliber, address passed as input
    - Pattern reference: blueprints/infinifi/{withdraw,account}.yaml

