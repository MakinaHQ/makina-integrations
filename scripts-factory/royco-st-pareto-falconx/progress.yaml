      - SUMMARY.md
    notes: |
      Major divergence from prior Royco STs - middle layer is IdleCDOTranche
      (NOT ERC4626), withdraw is epoch-queued (~32 days), and there are TWO
      off-chain access gates (Pareto Keyring + Royco AccessManager).
      Junior must be bootstrapped before senior deposits succeed (coverage check).
      See SUMMARY.md for full divergence matrix.
  1b_enrich:
    status: completed
    timestamp: "2026-04-30T13:10:00Z"
    artifacts:
      - functions.md
    notes: |
      RoycoSeniorTranche & RoycoFactory verified on Sourcify (not Etherscan).
      Royco Kernel impl for this market unverified - recovered from sibling.
      Pareto Keyring is actually KeyringIdleWhitelist - mapping at slot 2 is
      the Tenderly bypass surface. syncTrancheAccounting is NOT idempotent.
      FalconXUSDC receipt is non-transferrable.
  1c_offchain:
    status: skipped
    reason: |
      All flows in specs.yaml have offchain_indicators: []. No merkle proofs,
      signatures, or API calls needed - integration is fully on-chain.
      No harvest action in scope.
  2_deposit:
    status: completed
    timestamp: "2026-04-30T13:30:00Z"
    artifacts:
      - execution-deposit.md
    testnet_id: "5b132729-f79a-4ffc-8d2f-33bac4dc23f9"
    rpc_url: "https://virtual.mainnet.eu.rpc.tenderly.co/4ed6c929-bd54-4f22-a18d-aa575d39b78d"
    block: "0x17d5d55"
    notes: |
      Surprises vs spec:
       - Caliber ALREADY has Keyring credential on mainnet (no override needed)
       - Caliber ALREADY has Royco AccessManager grants for ST deposit/redeem
         and Kernel.syncTrancheAccounting (no override needed)
       - Only setup gate granted: JT_LP role (0xded17f6f89970f45) for junior
         bootstrap (junior bootstrapped via Royco JT, not Pareto BB, since
         Royco JT's asset() is the AA tranche).
      Deposit: 50000 USDC -> depositDuringEpoch -> 46248.053 AA ->
      RoycoST.deposit -> 49715.825 ST shares. 1.005715 USDC per ST.
      Mid-epoch discount applied.
  2_account:
    status: completed
    timestamp: "2026-04-30T13:40:00Z"
    artifacts:
      - execution-account.md
    notes: |
      All 3 valuation paths converge at 49,715.824587 USDC (jtAssets, stranded_aa,
      pending_usdc all zero in clean post-deposit state).
      syncTrancheAccounting() empirically NOT load-bearing at this block, but
      blueprint should still call it (kernel can lag across epochs).
      tranchePrice(AA) is pure view, returned 1,074,982 consistently.
      Recommended: Path A (asset-space full) so same blueprint works during
      withdraw window when caliber holds FalconXUSDC receipt instead of AA.
      Fork reverted to byte-identical post-deposit state for withdraw stage.
  2_withdraw:
    status: completed
    timestamp: "2026-04-30T14:00:00Z"
    artifacts:
      - execution-withdraw.md
    notes: |
      Two-phase withdraw confirmed:
        Phase 1: RoycoST.redeem -> AA -> requestWithdraw -> FalconXUSDC receipt
        (wait ~32-65d for epoch close)
        Phase 2: claimWithdrawRequest() (no args, claims entire pending)
      Full redeem (49,715.825 ST) -> 50,326.617406 USDC (+0.653%, ~4.18% APR over ~57d).
      Partial redeem also works; ~1.9 USDC slip from APR0 settlement bucket
      (sub-cent non-deterministic). Treat FalconXUSDC.balanceOf as near-upper-bound.
      Premature claim reverts NotAllowed() (0x3d693ada).
      Detection: IdleCreditVault.epochNumber() > lastWithdrawRequest(caliber).
      Post-claim re-deposit is idempotent.
      stopEpoch is manager-only Pareto ops step - blueprint can't gate on it,
      it's a runbook concern.
  3_blueprint:
    status: completed
    timestamp: "2026-04-30T15:00:00Z"
    artifacts:
      - blueprints/royco/st-pareto-falconx/deposit-running.yaml
      - blueprints/royco/st-pareto-falconx/deposit-idle.yaml
      - blueprints/royco/st-pareto-falconx/withdraw.yaml
      - blueprints/royco/st-pareto-falconx/claim.yaml
      - blueprints/royco/st-pareto-falconx/account.yaml
      - instructions/royco-st-pareto-falconx.yaml
      - machines/intMkSrRoyUSDC/mainnet/caliber.yaml (modified — added position 204541588220296843188812650988416231208)
    notes: |
      Deposit branch problem resolved with TWO blueprint variants because
      depositAA(uint256) and depositDuringEpoch(uint256,address) have
      incompatible signatures (different selectors and parameter shapes) — a
      weiroll ternary cannot dispatch between them in a single blueprint.
       - deposit-running.yaml -> calls depositDuringEpoch; guards on
         isEpochRunning && !isDepositDuringEpochDisabled (revertIfFalse / revertIfTrue).
       - deposit-idle.yaml    -> calls depositAA; guard on !isEpochRunning.
      Operator picks the variant that matches isEpochRunning() at submit time;
      either variant reverts cleanly with the BooleanHelper guard if the wrong
      one is invoked, so there is no risk of using depositAA mid-epoch (which
      would otherwise revert with Pausable: paused) or depositDuringEpoch
      between epochs (which the protocol allows but mints zero AA when no
      epoch is active).

      Account uses Path A (asset-space full):
        (stAssets + jtAssets + stranded_aa) * tranchePrice / 1e18 + FalconXUSDC.balanceOf
      so it remains correct during the multi-week withdraw window when the
      caliber holds FalconXUSDC instead of AA, and during partial-execution.

      Withdraw is split into two MANAGEMENT instructions (withdraw.yaml +
      claim.yaml) — non-atomic, separated by ~32-65 days. Phase 2 has NO
      Keyring gate and NO Royco role gate.

      Compile check:
        transpiler --input-file machines/intMkSrRoyUSDC/mainnet/caliber-test.yaml \
          --output-file ...rootfiles/compile-output.toml \
          --token-list token-lists/prod-token-list.json transpile
        => "✅ Rootfile successfully transpiled".
