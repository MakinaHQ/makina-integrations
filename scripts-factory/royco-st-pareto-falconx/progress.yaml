# Intent - set at Stage 0, immutable
intent:
  pool_id: "royco-pareto-st"
  pool_name: "Royco Senior Tranche - Pareto FalconX"
  protocol: "royco"
  chain: "mainnet"
  machine: "intMkSrRoyUSDC"
  actions: [deposit, withdraw, account]
  base_tokens:
    - address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
      symbol: "USDC"
      decimals: 6
      index: 0
  context: |
    New Senior Tranche (ST) integration for Pareto FalconX.

    Use machine intMkSrRoyUSDC for testing (already has other ST integrations:
    autousd, snusd, smokehouse-usdc, stcusd, syrupusdc).

    Key contracts:
      - Pareto FalconX vault (asset/underlying ERC4626 over USDC):
          0xc26a6fa2c37b38e549a4a1807543801db684f99c
      - Royco Pareto FalconX ST (the senior tranche):
          0x694ADB3077BBecE31882B6d6A74fc4A4fA6a754b
      - Royco Pareto FalconX Kernel (for NAV-based pricing):
          0x15bb63C07740ff972F76716cAcC5766f0C641791
      - Pareto oracle (used by Morpho, candidate for asset pricing):
          0x50449B3D1f5931d568A1951Ee506A9534e7f7dFf

    Documentation: https://docs.pareto.credit/developers/integrators/smart-contract
    Vault UI: https://app.pareto.credit/vault#0xC26A6Fa2C37b38E549a4a1807543801Db684f99C
    Reference mint tx: 0xbb9c2e8697bb98546d97b090c49ee0528d6dd5555d0be82af48557c3dc56d282

    The pattern should mirror the existing Royco ST integrations in this repo
    (see scripts-factory/royco-st-syrupusdc, scripts-factory/royco-st-stcusd,
    blueprints/royco/st-syrupusdc/, blueprints/royco/st-stcusd/).
    Specifically: USDC -> Pareto vault (ERC4626) -> ST shares for deposit,
    and the inverse for withdraw, with NAV-based or convertToAssets-based
    accounting depending on what the kernel exposes.

# Progress tracking
current_stage: 4
stages:
  0_intent: { status: completed, timestamp: "2026-04-30T00:00:00Z" }
  1_specs:
    status: completed
    timestamp: "2026-04-30T13:00:00Z"
    artifacts:
