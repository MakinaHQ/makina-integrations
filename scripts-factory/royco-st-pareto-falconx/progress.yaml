    rpc_url: "https://virtual.mainnet.eu.rpc.tenderly.co/cb5bd01f-5aa3-4329-bea3-9dffb74a4676"
    block: "0x17d5e3b"
    notes: |
      Full E2E ran on a fresh Tenderly mainnet fork through the spellcaster
      CLI. All 4 management actions (deposit mid-epoch, request_redeem,
      claim_redeem) plus account-positions executed successfully via
      `spellcaster manage-position` / `account-positions`.

      Pre-test setup (off-blueprint, runbook only): granted JT_LP role to
      caliber from AccessManager admin (impersonated), bootstrapped the
      junior leg via 10k USDC -> AA -> RoycoJT.deposit, funded borrower +
      manager with USDC/ETH for the Pareto stopEpoch ops.

      Senior deposit (50k USDC) -> 49,716.025 ST shares; account valuation
      49,715.531514 USDC matched on-chain math to the wei.

      Phase 1 redeem -> FalconXUSDC receipt 50,322.519155; display-positions
      correctly resourced position value to receipt during pending window.

      Phase 2 claim (after time-warp + startEpoch + stopEpoch) -> caliber
      USDC +50,322.519155 (matches receipt to the wei). Final account
      collapses position to 0.

      Senior P&L on the e2e fork: +322.519 USDC (+0.645%) over a simulated
      ~57 day cycle - tracks the explorer's +326.617 USDC closely.

      No blueprint or instruction edits required. No oracle staleness issues
      (accounting uses tranchePrice view, not Chainlink). Tenderly time
      control quirks (MEMORY.md) materialised: had to use
      tenderly_setNextBlockTimestamp before manager-only stopEpoch /
      startEpoch direct calls because evm_increaseTime did not persist
