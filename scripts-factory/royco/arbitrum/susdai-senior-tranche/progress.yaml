  4_test:
    status: completed
    timestamp: "2026-04-08T00:00:00Z"
    artifacts: [test-report.md]
    notes: |
      Deposit and Account-NAV: PASS (validated E2E via spellcaster CLI).
      Withdraw: NOT TESTED (protocol constraints - maxDeposit too low + MIN_REDEMPTION_SHARES).
      Bug fix: affected_tokens needed 2 USDC entries for 2 reserved_slots in accounting.
      Testnet: 163713df-39cf-4c1e-96d3-15392f351b6e

