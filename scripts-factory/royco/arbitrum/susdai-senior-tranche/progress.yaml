# Intent - set at Stage 0, immutable
intent:
  pool_id: "royco-susdai-st"
  pool_name: "Royco ST sUSDai"
  protocol: "royco"
  chain: "arbitrum"
  machine: "dusd"
  actions: [deposit, withdraw, account]
  base_tokens:
    - address: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
      symbol: "USDC"
      decimals: 6
      index: 0
  context: |
    Add a new Royco ST market for USDai on Arbitrum.
    Flow: USDC -> USDai -> sUSDai -> Royco ST (deposit), reverse for withdraw.
    Key contracts:
      USDai: 0x0A1a1A107E45b7Ced86833863f482BC5f4ed82EF
      sUSDai: 0x0B2b2B2076d95dda7817e785989fE353fe955ef9
      ST market: 0x90465aad4e426948A4ea342AC49A1A38200B7017
      Kernel: 0xFdb17E53eA5d342124b8473188BCB9F05F1949CA
    Withdraw may require two-step process if queues or cooldowns exist.
    For testing on virtual testnet, need to set whitelists for minting/redeeming USDai.
    Use DUSD machine (has Arbitrum caliber at 0xd1a1c248b253f1fc60eacd90777b9a63f8c8c1bc).
    Price any position in sUSDai or USDai queue using Kernel's conversion.
    Pattern similar to sNUSD ST integration (USDC -> NUSD -> sNUSD -> ST).

