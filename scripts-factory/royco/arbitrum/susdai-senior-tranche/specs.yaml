important_notes:
  no_whitelist_enforcement: |
    Unlike the sNUSD integration where the NUSD Router enforces a redeem whitelist,
    the USDai.withdraw() function does NOT enforce a whitelist for withdrawals.
    The USDai contract does have a blacklist (isBlacklisted) but no explicit
    mint/redeem whitelist. Any non-blacklisted address can deposit and withdraw.

  queue_based_redemption: |
    sUSDai uses a QUEUE-BASED redemption mechanism (not cooldown like sNUSD):
    1. requestRedeem() burns sUSDai shares and enters them in a FIFO queue
    2. Admin (STRATEGY_ADMIN_ROLE) calls serviceRedemptions() to process the queue
    3. After servicing, shares become "redeemable" and USDai becomes "withdrawable"
    4. User calls redeem() or withdraw() to claim the USDai
    Multiple requestRedeem() calls create SEPARATE entries (no overwrite).
    There is no fixed cooldown duration -- timing depends on admin servicing.

  blacklist: |
    The USDai contract has a blacklist mechanism. The Kernel also uses USDai's
    blacklist to prevent blacklisted addresses from interacting with tranches.
    The Kernel's isBlacklisted(address) checks against USDai's blacklist.
    Verify: USDai.isBlacklisted(caliber) should return false.

  st_deposit_2_arg: |
    The Senior Tranche on Arbitrum uses a 2-argument deposit:
    deposit(uint256 assets, address receiver)
    This is different from the sNUSD Senior Tranche on mainnet which uses 3-argument:
    deposit(uint256 assets, address receiver, address controller)
    This is a critical difference for blueprint generation.

  st_max_deposit: |
    The Senior Tranche has a maxDeposit limit that depends on the Kernel's
    accounting state. Currently maxDeposit returns ~1.02e17 (about 0.1 sUSDai).
    This may indicate the vault is near capacity or there are utilization limits.
    Check Kernel.stMaxDeposit(receiver) before depositing.

  usdai_swap_slippage: |
    USDai deposit/withdraw with USDC involves an internal Uniswap V3 swap
    between USDC and PYUSD (base token). Set appropriate slippage parameters
    in usdaiAmountMinimum (deposit) and withdrawAmountMinimum (withdraw).

  operator_mechanism: |
    sUSDai supports an operator mechanism via setOperator(address, bool).
    If the caliber needs a different address to call redeem/withdraw on its behalf,
    the caliber must first call sUSDai.setOperator(operatorAddress, true).

