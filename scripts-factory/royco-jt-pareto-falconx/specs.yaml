# =============================================================================
# DIVERGENCE FROM REFERENCE INTEGRATIONS
# =============================================================================
divergence:
  vs_royco_st_pareto_falconx:
    - id: coverage_gate_inverted
      summary: |
        The coverage check that BLOCKS the ST sibling on a fresh market does
        NOT apply to the JT.
      detail: |
        - ST.deposit reverts with the accountant's coverage error when
          `jtRawNAV == 0`, because `coveredExposure / jtEffectiveNAV ->
          uint256.max > liquidationUtilizationWAD`. This is the documented
          bootstrap blocker (`open_questions.junior_bootstrap` in ST specs).
        - JT.deposit is the bootstrap path. It runs through `kernel.jtDeposit`
          which does NOT enforce coverage post-op (only ST.deposit and
          JT.redeem do). So JT.deposit succeeds even on a fully empty market.
        - JT.redeem, on the other hand, DOES enforce coverage. This is the
          mirror constraint: redeeming junior reduces `jtEffectiveNAV` and
          can pop the coverage requirement. Full JT redeem is only possible
          if the ST tranche is also empty.
    - id: access_manager_role_id
      summary: |
        The Royco AccessManager role id for the JT is different from the ST.
      detail: |
        - JT.deposit and JT.redeem are both gated by role id
          `16055754263579004741` (= `0xded17f6f89970f45`, JT_LP role).
        - ST.deposit and ST.redeem are gated by role id
          `9623252227852051139` (ST_LP role).
        - Kernel.syncTrancheAccounting is gated by role id
          `15053450870919821405` and is SHARED — a caliber that already has
          this role from the ST integration does NOT need a fresh grant for
          the JT.
        - JT.deposit and JT.redeem share the SAME role id — one grant covers
          both flows.
    - id: convert_to_assets_slot_mapping
      summary: |
        Slot layout of `convertToAssets(uint256)` is role-fixed across ST and JT.
      detail: |
        - The on-chain return shape is `(uint256 stAssets, uint256 jtAssets,
          uint256 nav)` — see `Types.sol.AssetClaims` quote in
          `functions.md` §3.4.
        - The kernel's `_deriveTrancheAssetClaims(TrancheType, state)`
          populates the struct by tranche role, NOT by caller perspective:
            * `stAssets` is populated only when the SENIOR tranche has an
              AA claim (in the solvent state from a JT call, this is 0).
            * `jtAssets` is populated when the JUNIOR tranche has an AA
              claim (from a JT call this IS the JT's own AA claim).
            * `nav` is the calling tranche's NAV in USD WAD.
        - Empirical evidence on fork b0f9ddf1 (see
          `execution-account.md` for full citation + bootstrap cross-check):
            ST POV: ST.convertToAssets(stSupply) = (921.42 AA, 0, 997.07e18)
                     ==> ST's own AA claim is slot 0.
            JT POV: JT.convertToAssets(jtSupply) = (0, 46_071.09 AA, 49_853.53e18)
                     ==> JT's own AA claim is slot 1.
          Confirmed via the kernel's authoritative
          `previewSyncTrancheAccounting(JUNIOR)` which returns
          `claims.jtAssets = 46_071.09e18` in slot 1.
        - Therefore: INDEX 0 picks the ST's claim on the ST contract;
          INDEX 1 picks the JT's claim on the JT contract. The slot is
          NOT "the calling tranche's own claim" — it's the role-fixed
          struct field.
    - id: accounting_slot_index
      summary: |
        For ST accounting use slot 0; for JT accounting use slot 1.
      detail: |
        - The ST sibling reads `getTupleWord(ST.convertToAssets(_), 0)`
          to pick `stAssets` (the ST's own AA claim).
        - The JT integration reads `getTupleWord(JT.convertToAssets(_), 1)`
          to pick `jtAssets` (the JT's own AA claim).
        - Do NOT sum slot 0 + slot 1 on the JT — slot 0 is the ST's claim
          (zero in the solvent state from a JT call, but conceptually the
          ST tranche's, not the JT's). Summing would either be a no-op
          (solvent state) or over-credit the JT in the senior write-down
          state. Slot 1 only.

  vs_royco_jt_syrupusdc_and_jt_stcusd:
    - "The JT specs for syrupUSDC / stcUSD assume an ERC4626 middleware. Pareto's middleware is an IdleCDOTranche, NOT ERC4626 — same divergence the ST sibling already documents."
    - "Withdraw cadence is epoch-queued (~32 days) instead of synchronous."

# =============================================================================
# OPEN QUESTIONS / VERIFICATION REQUIRED BEFORE TESTING
# =============================================================================
open_questions:
  - id: caliber_jt_lp_role
    description: |
      Confirm Royco will grant the caliber address the JT_LP role
      (id `0xded17f6f89970f45`) on the JT market. Verify post-grant via
        RoycoFactory.canCall(caliber, ROY_JT, 0x6e553f65) -> (true, 0)  # deposit
        RoycoFactory.canCall(caliber, ROY_JT, 0xba087652) -> (true, 0)  # redeem
      Tenderly testing path: impersonate AccessManager admin and call
        grantRole(0xded17f6f89970f45, caliber, 0)
      (same pattern as the ST bootstrap helper, but the role id changes
      from ST_LP to JT_LP).
    blocking: true

  - id: caliber_keyring
    description: |
      Same as ST sibling: confirm the caliber holds Keyring policyId 18.
      Verified via `KeyringIdleWhitelist.checkCredential(18, caliber) ->
      true`. Already true on the ST integration's existing fork.
    blocking: true

  - id: kernel_sync_role
    description: |
      `Kernel.syncTrancheAccounting()` uses role id `15053450870919821405`
      which is the SAME role gate the ST integration uses. If the caliber
      was granted this role for the ST integration, no additional grant is
      needed. Confirm membership before reading accounting.
    blocking: true

  - id: jt_redeem_coverage_sizing
    description: |
      JT.redeem is coverage-gated. The execution-explorer should pick a
      redeem size small enough to stay within `liquidationUtilizationWAD`
      and `coverageWAD` after the redemption. For the bootstrap-only state
      (no ST yet) full redeem is fine. For a market with ST + JT both
      populated, size the test to ~10% of the JT shares to avoid coverage
      reverts.
    blocking: false

  - id: epoch_alignment
    description: |
      Same as ST: operations team coordinates withdraw timing with the
      Pareto epoch schedule. Optional offchain helper reading
      `epochEndDate`, `isEpochRunning`, `bufferPeriod`,
      `disableInstantWithdraw`, `allowAAWithdrawRequest`,
      `allowInstantWithdraw`.
    blocking: false

