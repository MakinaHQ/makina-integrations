# Intent - set at Stage 0, immutable
intent:
  pool_id: "royco-pareto-jt"
  pool_name: "Royco Junior Tranche - Pareto FalconX"
  protocol: "royco"
  chain: "mainnet"
  machine: "dusd"
  actions: [deposit, withdraw, account]
  base_tokens:
    - address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
      symbol: "USDC"
      decimals: 6
      index: 0
  context: |
    New Junior Tranche (JT) integration for Pareto FalconX, on DUSD machine.

    Mirrors the already-shipped Royco ST sibling exactly except routes through
    the JT contract instead of the ST contract. Both Royco ST and Royco JT for
    the FalconX market share the same `asset()` = Pareto AA tranche token —
    the Royco "junior" is a Royco-level subordination layer, NOT the Pareto BB
    tranche.

    Key contracts (mainnet):
      - Royco JT (this pool, ERC4626 over AA tranche):
          0x8e0EC43e51B88AA2324102E1A3D667822bE51a6d
      - Pareto AA tranche (JT/ST `asset()`):
          0xC26A6Fa2C37b38E549a4a1807543801Db684f99C
      - Pareto IdleCDOEpochVariant (deposit/withdraw entry):
          0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d
      - Pareto IdleCreditVault (FalconXUSDC withdraw receipt, 6 dec):
          0x17E9Ab2992dfecBe779a06A92a6cDB9fE6aEeEf3
      - Royco Kernel (syncTrancheAccounting):
          0x15bb63C07740ff972F76716cAcC5766f0C641791
      - Royco AccessManager (deposit/redeem role grants):
          0x7cC6fB28eC7b5e7afC3cB3986141797ffc27253C
      - Pareto KeyringIdleWhitelist (off-chain credential, policy 18):
          0x6a6a91c7c7c05f9f6b8bc9f6e5ea231e460450e3

    Reference integration to mirror:
      scripts-factory/royco-st-pareto-falconx/
      blueprints/royco/st-pareto-falconx/
      instructions/royco-st-pareto-falconx.yaml

    Existing JT reference (different middleware, but pattern for JT shape):
      scripts-factory/royco/arbitrum/susdai-senior-tranche (no — that is ST)
      blueprints/royco/jt-syrupusdc/, blueprints/royco/jt-stcusd/

    Flow shape (deposit, atomic):
      USDC -> approve(CDO) -> [depositAA | depositDuringEpoch(amt, AATranche)]
            -> AA tranche -> approve(RoycoJT) -> RoycoJT.deposit(amount, caliber)
            -> JT shares minted to caliber.

    Flow shape (withdraw, two-phase, ~32-65d apart):
      Phase 1: RoycoJT.redeem(shares, caliber, caliber) -> AA tranche
               -> IdleCDOEpochVariant.requestWithdraw(aaAmount, AATranche)
               -> FalconXUSDC receipt minted to caliber, AA burned.
      Phase 2: IdleCDOEpochVariant.claimWithdrawRequest() -> burns receipt, pays USDC.

    Account (asset-space, mirrors ST):
      JT.balanceOf(caliber) -> shares
      Kernel.syncTrancheAccounting()
      JT.convertToAssets(shares) -> (stAssets, jtAssets, nav) [3-tuple, 18-dec AA units]
        NOTE: verify the JT returns the same 3-tuple shape; otherwise fall back
        to a 1-word convertToAssets and pair with AA.balanceOf for stranded AA.
      AA.balanceOf(caliber) -> stranded_aa
      total_aa = stAssets + jtAssets + stranded_aa
      usdc_from_aa = total_aa * IdleCDOEpochVariant.tranchePrice(AATranche) / 1e18
      total_usdc = usdc_from_aa + FalconXUSDC.balanceOf(caliber)

    Access control (must be granted before deposit/withdraw succeeds on mainnet,
    but typically already granted — confirm during execution):
      - Pareto Keyring policy 18 credential on caliber.
      - Royco AccessManager grants for JT deposit, JT redeem, and
        Kernel.syncTrancheAccounting selectors. The role id is the JT_LP role
        0xded17f6f89970f45 used in the ST bootstrap helper. For Tenderly,
        override via storage writes / impersonation, identical to ST.

    No harvest in scope. No offchain data needed (mirror ST, which skipped 1c).

