           snapshot = 49,853.528264 USDC matches `tranchePrice` exactly),
           and (b) for the IdleCDOEpochVariant the two are numerically
           equivalent during an active epoch (no continuous accrual) and
           at sync boundaries. `tranchePrice` is the stored value the
           kernel itself uses for accounting; `virtualPrice` is the live
           mark-to-market alternative. Either path produces the same
           USDC accounting on this CDO variant; we picked `tranchePrice`
           to match the stage 2 empirical reference exactly.

