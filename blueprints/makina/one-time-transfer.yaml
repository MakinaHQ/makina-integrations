protocol: "makina"

inputs:
  kv_store_address:
    type: "address"
  boolean_helper_address:
    type: "address"
  token_address:
    type: "address"
  recipient_address:
    type: "address"
  transfer_amount:
    type: "uint256"
  kv_store_key:
    type: "bytes32"

actions:
  one_time_transfer:
    calls:
      # check if the transfer has already been made
      - description: "Check if transfer has already been made"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.kv_store_key}"
        return:
          name: "transfer_done"
          type: "bool"

      - description: "Revert if transfer has already been made"
        target: "${inputs.boolean_helper_address}"
        selector: "revertIfTrue(bool)"
        parameters:
          - type: "bool"
            value: "${returns.transfer_done}"

      # perform the transfer
      - description: "Transfer the token amount to the recipient"
        target: "${inputs.token_address}"
        selector: "transfer(address,uint256)"
        parameters:
          - type: "address"
            value: "${inputs.recipient_address}"
          - type: "uint256"
            value: "${inputs.transfer_amount}"

      # mark the transfer as done in the kv store
      - description: "Mark transfer as done in KV store"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.kv_store_key}"
          - type: "bool"
            value: "true"
