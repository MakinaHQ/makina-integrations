protocol: "prime-swap"

# PRIME synthetic "swap in": acquire PRIME from an entry asset (USDC) via TWO
# synchronous ERC4626 deposits — USDC -> wYLDS -> PRIME. Base-token model:
# PRIME is a registered caliber base token (own OracleRegistry PRIME/USD 2-hop
# route), so the acquired PRIME is valued natively by the registry and the paired
# accounting action returns 0 (see blueprints/common/account_0.yaml:account_0).
# The MANAGEMENT leg therefore uses affected_tokens=[] (USDC -> PRIME, both base
# tokens; nothing to check on the swap leg — value conservation comes from the
# min_shares slippage floor, not accounting).
#
# Mechanism (verified on a mainnet fork 2026-07-22):
#   1. USDC.approve(wYLDS, asset_amount)
#   2. wYLDS.deposit(asset_amount, caliber) -> wylds_received      (0x6e553f65; 1:1, EXACT)
#   3. wYLDS.approve(PRIME, wylds_received)
#   4. PRIME.deposit(wylds_received, caliber) -> prime_shares      (0x6e553f65; NAV-priced,
#      shares = assets*1e18/getVerifiedNav)
#   5. guard: revert unless prime_shares >= min_shares (slippage floor)
#
# Standard ERC4626 deposit(uint256,address) has NO native minShares argument
# (unlike the re ICL), so the slippage floor is enforced with an explicit
# gte + revertIfFalse guard on the realised PRIME shares.
#
# Philosophy: this blueprint is inherently PRIME-specific — the swap topology is a
# FIXED USDC -> wYLDS -> PRIME chain, so the entry asset can only ever be USDC and
# the three token addresses are fixed mainnet deployments. They are therefore
# constants; the caliber is the only per-machine value.
#
# Expected inputs (from instructions/prime-swap-in.yaml):
#   caliber_address — deposit receiver / position holder

constants:
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"
  boolean_helper_address:
    type: "address"
    value: "0x00c93e3b09Ca2f544487d4298339765EadCD8353"
  # Entry asset pulled from the caliber (always USDC).
  usdc_address:
    type: "address"
    value: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
  # wYLDS ERC4626 over USDC (sync deposit).
  wylds_address:
    type: "address"
    value: "0x6aD038cA6C04e885630851278ca0a856Ad9a66Cc"
  # PRIME ERC4626 over wYLDS (sync deposit).
  prime_address:
    type: "address"
    value: "0x19ebb35279A16207Ec4ba82799CC64715065F7F6"

inputs:
  caliber_address:
    type: "address"

actions:
  swap_asset_for_prime:
    calls:
      - description: "Approve wYLDS vault to spend the entry asset (USDC)"
        target: "${constants.usdc_address}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${constants.wylds_address}"
          - type: "uint256"
            value: "${input_slots.asset_amount}"

      - description: "Deposit USDC into wYLDS (sync ERC4626, 1:1) minting wYLDS to the caliber"
        target: "${constants.wylds_address}"
        selector: "deposit(uint256,address)"
        parameters:
          - type: "uint256"
            value: "${input_slots.asset_amount}"
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "wylds_received"
          type: "uint256"

      - description: "Approve PRIME vault to spend the wYLDS just received"
        target: "${constants.wylds_address}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${constants.prime_address}"
          - type: "uint256"
            value: "${returns.wylds_received}"

      - description: "Deposit wYLDS into PRIME (sync ERC4626, NAV-priced) minting PRIME to the caliber"
        target: "${constants.prime_address}"
        selector: "deposit(uint256,address)"
        parameters:
          - type: "uint256"
            value: "${returns.wylds_received}"
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "prime_shares"
          type: "uint256"

      - description: "Slippage floor: realised PRIME shares >= min_shares"
        target: "${constants.math_helper_address}"
        selector: "gte(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.prime_shares}"
          - type: "uint256"
            value: "${input_slots.min_shares}"
        return:
          name: "shares_ok"
          type: "bool"

      - description: "Revert if realised PRIME shares are below the slippage floor"
        target: "${constants.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.shares_ok}"

    input_slots:
      asset_amount:
        type: "uint256"
        description: "Amount of entry asset (USDC, 6-dec) to swap into PRIME"
      min_shares:
        type: "uint256"
        description: "Minimum PRIME shares to mint (slippage protection, PRIME 6-dec)"
