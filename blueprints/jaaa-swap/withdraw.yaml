protocol: "jaaa-swap"

# JAAA synthetic "swap out": dispose of JAAA back to USDC through the Centrifuge V3 ERC-7540
# AsyncVault. Mirror of deposit.yaml, with ONE asymmetry that matters for accounting: the
# shares LEAVE the caliber at step 1 but are not destroyed until step 3.
#
#   1. [caliber]  request_redeem -> shares to the pool escrow, ESCROWED NOT BURNED
#   2. [operator] approveRedeems -> epoch sealed, no token movement
#   3. [operator] revokeShares   -> THE BURN; redeemPrice fixed HERE, USDC reserved in escrow
#   4. [caliber]  claim_redeem   -> USDC pool escrow -> caliber (nothing burned)
#
# NO SHARE APPROVAL on the request, and that is structural. The shares move via
# BalanceSheet.transferSharesFrom -> ShareToken.authTransferFrom -> _transferFrom, whose
# ENTIRE allowance path is guarded by `if (from != sender)`. requestRedeem threads
# sender_ = msg.sender and from = owner, both the caliber, so the branch never runs and no
# allowance is read. An approve leg here would be dead code.
#
# No one-in-flight guard is needed: `pendingRedeemRequest += shares_` accumulates repeat
# requests into the same epoch bucket. The only blocking condition is a pending cancellation,
# which this integration never initiates.
#
# No slippage floor is possible — redeemPrice is written by the operator after our request is
# mined. Same reasoning and same mitigation as deposit.yaml.
#
# Expected inputs (from instructions/jaaa-redemption.yaml):
#   caliber_address — request owner + controller, claim receiver, position holder

constants:
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"
  boolean_helper_address:
    type: "address"
    value: "0x00c93e3b09Ca2f544487d4298339765EadCD8353"
  vault_address:
    type: "address"
    value: "0x4880799eE5200fC58DA299e965df644fBf46780B"
  # JAAA share token — read for the relative variant's balance only; never approved.
  jaaa_address:
    type: "address"
    value: "0x5a0F93D040De44e78F251b03c43be9CF317Dcf64"

inputs:
  caliber_address:
    type: "address"

actions:
  # ── Step 1, absolute: request redemption of an exact JAAA amount ─────────────
  request_redeem:
    calls:
      - description: "Request the async redemption — JAAA moves to the pool escrow (privileged transfer, no allowance), NOT burned yet"
        target: "${constants.vault_address}"
        selector: "requestRedeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${input_slots.share_amount}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"

    input_slots:
      share_amount:
        type: "uint256"
        description: "Exact amount of JAAA shares (6-dec) to request redemption for"

  # ── Step 1, relative: request a bps fraction of the caliber's JAAA balance ───
  request_redeem_relative:
    calls:
      - description: "Read the caliber's JAAA balance"
        target: "${constants.jaaa_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "share_balance"
          type: "uint256"

      - description: "Compute JAAA amount = balance * bps / 10000"
        target: "${constants.math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.share_balance}"
          - type: "uint256"
            value: "${input_slots.bps_to_redeem}"
          - type: "uint256"
            value: "10000"
        return:
          name: "share_amount"
          type: "uint256"

      - description: "Request the async redemption — JAAA moves to the pool escrow, NOT burned yet"
        target: "${constants.vault_address}"
        selector: "requestRedeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${returns.share_amount}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"

    input_slots:
      bps_to_redeem:
        type: "uint256"
        description: "Basis points of the caliber's JAAA balance to redeem (10000 = 100%)"

  # ── Step 4: claim the USDC the operator has already reserved ─────────────────
  #
  # Pull-only, claims the FULL entitlement.
  #
  # withdraw(maxWithdraw), NOT redeem(maxRedeem) — the exact mirror of claim_deposit's
  # mint-vs-deposit argument. _processRedeem debits by `assetsUp` and pays `assetsDown`;
  # withdraw(assets) passes the caller's amount as both bounds, so state.maxWithdraw goes to
  # exactly 0 and exactly maxWithdraw USDC is paid, while redeem(maxRedeem) destroys 1 wei of
  # entitlement per claim and leaves an unclearable residue.
  #
  # maxWithdraw is hook-gated like maxMint, so a de-whitelisted caliber reverts on the gt
  # guard rather than deeper in the call; the USDC stays reserved in the pool escrow.
  claim_redeem:
    calls:
      - description: "Read the claimable USDC entitlement (0 unless the operator has revoked shares)"
        target: "${constants.vault_address}"
        selector: "maxWithdraw(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "claimable_assets"
          type: "uint256"

      - description: "has_claimable = (claimable assets > 0)"
        target: "${constants.math_helper_address}"
        selector: "gt(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.claimable_assets}"
          - type: "uint256"
            value: "0"
        return:
          name: "has_claimable"
          type: "bool"

      - description: "Revert on a no-op claim rather than burning a management call silently"
        target: "${constants.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.has_claimable}"

      - description: "Claim: release the reserved USDC from the pool escrow to the caliber (exact, maxWithdraw -> 0)"
        target: "${constants.vault_address}"
        selector: "withdraw(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${returns.claimable_assets}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"
