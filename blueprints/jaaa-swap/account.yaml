protocol: "jaaa-swap"

# JAAA in-flight accounting — PENDING-ONLY, both sides.
#
# JAAA is a registered caliber base token, so shares the caliber HOLDS are already valued by
# the OracleRegistry. Neither action reads balanceOf, and that omission is the point: it is
# what stops the held position being counted twice. What is covered is the value that exists
# in NEITHER token balance while a request is mid-flight — four disjoint states:
#
#   deposit  pendingDepositRequest   USDC sent, not yet issued     (asset-denom)
#            maxMint                 issued, not yet claimed       (SHARE-denom)
#   redeem   pendingRedeemRequest    shares sent, not yet revoked  (SHARE-denom)
#            maxWithdraw             revoked, not yet claimed      (asset-denom)
#
# Both reserved slots are reported in USDC, so the paired instructions declare
# affected_tokens=[USDC], NOT [JAAA]. The share-denominated terms are pushed through
# convertToAssets first — reporting them raw would inflate them by the share premium (~4.7%).
#
# The issued-not-yet-claimed term is convertToAssets(maxMint), NOT claimableDepositRequest.
# The latter is `return maxDeposit(c)`, i.e. maxMint at the price the OPERATOR fixed when it
# settled the epoch — a cost basis, not a mark. The caliber is owed a fixed number of shares
# and the registry prices them at the CURRENT price the moment they land, so the epoch price
# steps NAV at the claim by the accrual over claim latency (~1.6 bps/day for a ~6%/yr fund).
# convertToAssets(maxMint) also reads the same ledger quantity the claim call consumes
# (deposit.yaml:claim_deposit calls mint(maxMint)), making the claim leg NAV-neutral.
#
# Do NOT also read maxDeposit / claimableDepositRequest (same claim as maxMint, in asset
# units), or claimableRedeemRequest alongside maxWithdraw (same claim, share vs asset view).
# Either would double-count.
#
# NAV continuity across a request holds only if the registry's first-hop JAAA rate adapter
# derives from THIS vault's convertToAssets; an independent feed steps NAV on every request.
# Go-live requirement, stated in instructions/jaaa-swap-in.yaml.
#
# Every getter used here returns 0 rather than reverting when flat, so the slot goes to 0 and
# the position closes cleanly. But the CLAIMABLE getters (unlike pending*) short-circuit to 0
# when the hook membership check fails: losing membership while a claimable amount is
# outstanding collapses the term and drops NAV until membership is restored. Funds stay
# recoverable; keeping the caliber's hook membership live is an operational invariant.
#
# Expected inputs (from the instructions/jaaa-*.yaml pair):
#   caliber_address — the controller whose in-flight requests are valued

constants:
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"
  vault_address:
    type: "address"
    value: "0x4880799eE5200fC58DA299e965df644fBf46780B"

inputs:
  caliber_address:
    type: "address"

actions:
  # Deposit-side in-flight value: USDC sent but JAAA not yet in the caliber.
  # pendingDepositRequest is USDC already (unconverted escrowed USDC); the issued-shares term
  # is SHARE-denominated and is marked through convertToAssets. Zero when nothing is in flight.
  account_deposit_pending:
    calls:
      - description: "USDC requested but not yet issued by the operator (ERC-7540 requestId is always 0)"
        target: "${constants.vault_address}"
        selector: "pendingDepositRequest(uint256,address)"
        parameters:
          - type: "uint256"
            value: "0"
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "pending_assets"
          type: "uint256"

      - description: "Shares already issued into the pool escrow but not yet claimed (disjoint from pending)"
        target: "${constants.vault_address}"
        selector: "maxMint(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "claimable_shares"
          type: "uint256"

      - description: "Mark the issued shares at the CURRENT pool price (see header — NOT claimableDepositRequest)"
        target: "${constants.vault_address}"
        selector: "convertToAssets(uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.claimable_shares}"
        return:
          name: "claimable_assets"
          type: "uint256"

      - description: "Total deposit-side in-flight value, in USDC terms"
        target: "${constants.math_helper_address}"
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.pending_assets}"
          - type: "uint256"
            value: "${returns.claimable_assets}"
        return:
          name: "total_pending_assets"
          type: "uint256"

    reserved_slots:
      - type: "uint256"
        value: "${returns.total_pending_assets}"
      - type: "uint256"
        value: "${builtins.UINT256_MAX}"

  # Redeem-side in-flight value: JAAA has left the caliber but the USDC has not arrived.
  # pendingRedeemRequest is SHARE-denominated and MUST be converted; maxWithdraw is already
  # USDC-denominated. Zero when nothing is in flight.
  account_redeem_pending:
    calls:
      - description: "Shares requested but not yet revoked by the operator (ERC-7540 requestId is always 0)"
        target: "${constants.vault_address}"
        selector: "pendingRedeemRequest(uint256,address)"
        parameters:
          - type: "uint256"
            value: "0"
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "pending_shares"
          type: "uint256"

      - description: "Convert pending shares to USDC terms (see header — do NOT report raw shares)"
        target: "${constants.vault_address}"
        selector: "convertToAssets(uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.pending_shares}"
        return:
          name: "pending_assets"
          type: "uint256"

      - description: "USDC revoked and reserved in the pool escrow but not yet claimed (disjoint from pending)"
        target: "${constants.vault_address}"
        selector: "maxWithdraw(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "claimable_assets"
          type: "uint256"

      - description: "Total redeem-side in-flight value, in USDC terms"
        target: "${constants.math_helper_address}"
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.pending_assets}"
          - type: "uint256"
            value: "${returns.claimable_assets}"
        return:
          name: "total_pending_assets"
          type: "uint256"

    reserved_slots:
      - type: "uint256"
        value: "${returns.total_pending_assets}"
      - type: "uint256"
        value: "${builtins.UINT256_MAX}"
