protocol: "superstate"

# settle: pull the delivery from the attached Safe into the caliber and zero the claim,
# in one delta-checked tx. See docs/superstate-offchain/README.md.

constants:
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0" # add/sub/mul/div for abi_encode_call

inputs:
  # Per chain, from caliber config (docs/attached-safe/README.md)
  boolean_helper_address: # revertIfFalse
    type: "address"
  caliber_helper_address: # addressEq
    type: "address"
  kv_store_address:
    type: "address"
  attached_safe_kv_key:
    type: "bytes32"
  claim_kv_key:
    type: "bytes32"
  caliber_address:
    type: "address"
  attached_safe_address:
    type: "address"
  delivery_token:
    type: "address"

actions:
  settle:
    calls:
      # ── [attached-safe registry] BEGIN: input Safe == registered Safe (docs/attached-safe/README.md) ──
      - description: "[attached-safe registry] Read the registry"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.attached_safe_kv_key}"
        return:
          name: "registered_safe"
          type: "address"

      - description: "[attached-safe registry] Configured Safe is the one this caliber created?"
        target: "${inputs.caliber_helper_address}"
        selector: "addressEq(address,address)"
        parameters:
          - type: "address"
            value: "${returns.registered_safe}"
          - type: "address"
            value: "${inputs.attached_safe_address}"
        return:
          name: "safe_is_registered"
          type: "bool"

      - description: "[attached-safe registry] Revert unless registered by `create`"
        target: "${inputs.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.safe_is_registered}"
      # ── [attached-safe registry] END ──

      - description: "Everything delivered so far"
        target: "${inputs.delivery_token}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${inputs.attached_safe_address}"
        return:
          name: "delivered"
          type: "uint256"

      - description: "Safe executes delivery_token.transfer(caliber, delivered) — caliber is its module"
        target: "${inputs.attached_safe_address}"
        selector: "execTransactionFromModule(address,uint256,bytes,uint8)"
        parameters:
          - type: "address"
            value: "${inputs.delivery_token}"
          - type: "uint256"
            value: "0"
          - type: "bytes"
            value:
              abi_encode_call:
                selector: "transfer(address,uint256)"
                math_helper: "${constants.math_helper_address}"
                parameters:
                  - type: "address"
                    value: "${inputs.caliber_address}"
                  - type: "uint256"
                    value: "${returns.delivered}"
          - type: "uint8"
            value: "0" # CALL — never DELEGATECALL
        return:
          name: "sweep_success"
          type: "bool"

      - description: "Module calls do not revert on failure — do it here"
        target: "${inputs.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.sweep_success}"

      - description: "Close the claim in the same tx; the delta check verifies the delivery covers it"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.claim_kv_key}"
          - type: "uint256"
            value: "${builtins.UINT256_0}"
