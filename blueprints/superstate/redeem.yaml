protocol: "superstate"

# redeem: offchainRedeem burns fund tokens, and the claim grows by the amount.
# Superstate then pays the stablecoin to the attached Safe. See docs/superstate-offchain/README.md.

constants:
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0" # add

inputs:
  # Per chain, from caliber config (docs/attached-safe/README.md)
  boolean_helper_address: # revertIfFalse
    type: "address"
  caliber_helper_address: # addressEq
    type: "address"
  kv_store_address:
    type: "address"
  attached_safe_kv_key:
    type: "bytes32"
  claim_kv_key:
    type: "bytes32"
  attached_safe_address:
    type: "address"
  fund_token:
    type: "address"

actions:
  redeem:
    calls:
      # ── [attached-safe registry] BEGIN: input Safe == registered Safe (docs/attached-safe/README.md) ──
      - description: "[attached-safe registry] Read the registry"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.attached_safe_kv_key}"
        return:
          name: "registered_safe"
          type: "address"

      - description: "[attached-safe registry] Configured Safe is the one this caliber created?"
        target: "${inputs.caliber_helper_address}"
        selector: "addressEq(address,address)"
        parameters:
          - type: "address"
            value: "${returns.registered_safe}"
          - type: "address"
            value: "${inputs.attached_safe_address}"
        return:
          name: "safe_is_registered"
          type: "bool"

      - description: "[attached-safe registry] Revert unless registered by `create`"
        target: "${inputs.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.safe_is_registered}"
      # ── [attached-safe registry] END ──

      - description: "Outstanding claim"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.claim_kv_key}"
        return:
          name: "outstanding"
          type: "uint256"

      - description: "new_total = outstanding + amount"
        target: "${constants.math_helper_address}"
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.outstanding}"
          - type: "uint256"
            value: "${input_slots.amount}"
        return:
          name: "new_total"
          type: "uint256"

      - description: "Burn and emit OffchainRedeem — the documented redemption entry point"
        target: "${inputs.fund_token}"
        selector: "offchainRedeem(uint256)"
        parameters:
          - type: "uint256"
            value: "${input_slots.amount}"

      - description: "Book the claim — `account` reports it until the payout is settled"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.claim_kv_key}"
          - type: "uint256"
            value: "${returns.new_total}"

    input_slots:
      amount:
        type: "uint256"
        description: "Fund tokens to redeem, in their own decimals"
