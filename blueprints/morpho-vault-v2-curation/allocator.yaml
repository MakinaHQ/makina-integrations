protocol: "morpho-vault-v2-curation"

inputs:
  vault_address:
    type: "address"
  vault_v2_calldata_encoder:
    type: "address"

actions:
  allocate_morpho_vault_v1_adapter:
    calls:
      - description: "Encode MorphoVaultV1Adapter adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoVaultV1AdapterData()"
        parameters: []
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Allocate idle assets via MorphoVaultV1Adapter"
        target: "${inputs.vault_address}"
        selector: "allocate(address,bytes,uint256)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
          - type: "uint256"
            value: "${input_slots.assets}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoVaultV1Adapter address"
      assets:
        type: "uint256"
        description: "Asset amount to allocate"

  deallocate_morpho_vault_v1_adapter:
    calls:
      - description: "Encode MorphoVaultV1Adapter adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoVaultV1AdapterData()"
        parameters: []
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Deallocate assets via MorphoVaultV1Adapter"
        target: "${inputs.vault_address}"
        selector: "deallocate(address,bytes,uint256)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
          - type: "uint256"
            value: "${input_slots.assets}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoVaultV1Adapter address"
      assets:
        type: "uint256"
        description: "Asset amount to deallocate"

  set_liquidity_adapter_and_data_morpho_vault_v1_adapter:
    calls:
      - description: "Encode MorphoVaultV1Adapter adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoVaultV1AdapterData()"
        parameters: []
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Set liquidity adapter and routing data via MorphoVaultV1Adapter"
        target: "${inputs.vault_address}"
        selector: "setLiquidityAdapterAndData(address,bytes)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoVaultV1Adapter address"

  allocate_morpho_market_v1_adapter_v2:
    calls:
      - description: "Encode MorphoMarketV1AdapterV2 adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoMarketV1AdapterV2Data((address,address,address,address,uint256))"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value:
              - type: "address"
                value: "${input_slots.loan_token}"
              - type: "address"
                value: "${input_slots.collateral_token}"
              - type: "address"
                value: "${input_slots.oracle}"
              - type: "address"
                value: "${input_slots.irm}"
              - type: "uint256"
                value: "${input_slots.lltv}"
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Allocate idle assets via MorphoMarketV1AdapterV2"
        target: "${inputs.vault_address}"
        selector: "allocate(address,bytes,uint256)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
          - type: "uint256"
            value: "${input_slots.assets}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoMarketV1AdapterV2 address"
      loan_token:
        type: "address"
        description: "Morpho market loan token"
      collateral_token:
        type: "address"
        description: "Morpho market collateral token"
      oracle:
        type: "address"
        description: "Morpho market oracle"
      irm:
        type: "address"
        description: "Morpho market IRM"
      lltv:
        type: "uint256"
        description: "Morpho market LLTV"
      assets:
        type: "uint256"
        description: "Asset amount to allocate"

  deallocate_morpho_market_v1_adapter_v2:
    calls:
      - description: "Encode MorphoMarketV1AdapterV2 adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoMarketV1AdapterV2Data((address,address,address,address,uint256))"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value:
              - type: "address"
                value: "${input_slots.loan_token}"
              - type: "address"
                value: "${input_slots.collateral_token}"
              - type: "address"
                value: "${input_slots.oracle}"
              - type: "address"
                value: "${input_slots.irm}"
              - type: "uint256"
                value: "${input_slots.lltv}"
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Deallocate assets via MorphoMarketV1AdapterV2"
        target: "${inputs.vault_address}"
        selector: "deallocate(address,bytes,uint256)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
          - type: "uint256"
            value: "${input_slots.assets}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoMarketV1AdapterV2 address"
      loan_token:
        type: "address"
        description: "Morpho market loan token"
      collateral_token:
        type: "address"
        description: "Morpho market collateral token"
      oracle:
        type: "address"
        description: "Morpho market oracle"
      irm:
        type: "address"
        description: "Morpho market IRM"
      lltv:
        type: "uint256"
        description: "Morpho market LLTV"
      assets:
        type: "uint256"
        description: "Asset amount to deallocate"

  set_liquidity_adapter_and_data_morpho_market_v1_adapter_v2:
    calls:
      - description: "Encode MorphoMarketV1AdapterV2 adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoMarketV1AdapterV2Data((address,address,address,address,uint256))"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value:
              - type: "address"
                value: "${input_slots.loan_token}"
              - type: "address"
                value: "${input_slots.collateral_token}"
              - type: "address"
                value: "${input_slots.oracle}"
              - type: "address"
                value: "${input_slots.irm}"
              - type: "uint256"
                value: "${input_slots.lltv}"
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Set liquidity adapter and routing data via MorphoMarketV1AdapterV2"
        target: "${inputs.vault_address}"
        selector: "setLiquidityAdapterAndData(address,bytes)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoMarketV1AdapterV2 address"
      loan_token:
        type: "address"
        description: "Morpho market loan token"
      collateral_token:
        type: "address"
        description: "Morpho market collateral token"
      oracle:
        type: "address"
        description: "Morpho market oracle"
      irm:
        type: "address"
        description: "Morpho market IRM"
      lltv:
        type: "uint256"
        description: "Morpho market LLTV"

  set_max_rate:
    calls:
      - description: "Set maximum share-price growth rate"
        target: "${inputs.vault_address}"
        selector: "setMaxRate(uint256)"
        parameters:
          - type: "uint256"
            value: "${input_slots.max_rate}"
    input_slots:
      max_rate:
        type: "uint256"
        description: "New maximum rate"
