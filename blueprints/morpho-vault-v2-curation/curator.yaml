protocol: "morpho-vault-v2-curation"

inputs:
  vault_address:
    type: "address"
  vault_v2_calldata_encoder:
    type: "address"

actions:
  submit_add_adapter:
    calls:
      - description: "Encode addAdapter calldata"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeAddAdapter(address)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
        return:
          name: "call_data"
          type: "bytes"

      - description: "Submit pending timelocked addAdapter call"
        target: "${inputs.vault_address}"
        selector: "submit(bytes)"
        parameters:
          - type: "bytes"
            value: "${returns.call_data}"
    input_slots:
      adapter:
        type: "address"
        description: "Adapter to enable for allocations"

  revoke_add_adapter:
    calls:
      - description: "Encode addAdapter calldata"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeAddAdapter(address)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
        return:
          name: "call_data"
          type: "bytes"

      - description: "Revoke pending timelocked addAdapter call"
        target: "${inputs.vault_address}"
        selector: "revoke(bytes)"
        parameters:
          - type: "bytes"
            value: "${returns.call_data}"
    input_slots:
      adapter:
        type: "address"
        description: "Adapter to enable for allocations"

  submit_remove_adapter:
    calls:
      - description: "Encode removeAdapter calldata"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeRemoveAdapter(address)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
        return:
          name: "call_data"
          type: "bytes"

      - description: "Submit pending timelocked removeAdapter call"
        target: "${inputs.vault_address}"
        selector: "submit(bytes)"
        parameters:
          - type: "bytes"
            value: "${returns.call_data}"
    input_slots:
      adapter:
        type: "address"
        description: "Adapter to disable after its allocation is zero"

  revoke_remove_adapter:
    calls:
      - description: "Encode removeAdapter calldata"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeRemoveAdapter(address)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
        return:
          name: "call_data"
          type: "bytes"

      - description: "Revoke pending timelocked removeAdapter call"
        target: "${inputs.vault_address}"
        selector: "revoke(bytes)"
        parameters:
          - type: "bytes"
            value: "${returns.call_data}"
    input_slots:
      adapter:
