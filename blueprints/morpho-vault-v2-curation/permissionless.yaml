protocol: "morpho-vault-v2-curation"

inputs:
  vault_address:
    type: "address"
  vault_v2_calldata_encoder:
    type: "address"

actions:
  force_deallocate_morpho_vault_v1_adapter:
    calls:
      - description: "Encode MorphoVaultV1Adapter adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoVaultV1AdapterData()"
        parameters: []
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Force deallocate assets for in-kind redemption via MorphoVaultV1Adapter"
        target: "${inputs.vault_address}"
        selector: "forceDeallocate(address,bytes,uint256,address)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
          - type: "uint256"
            value: "${input_slots.assets}"
          - type: "address"
            value: "${input_slots.on_behalf_of}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoVaultV1Adapter address"
      assets:
        type: "uint256"
        description: "Asset amount to force deallocate"
      on_behalf_of:
        type: "address"
        description: "Account on whose behalf the deallocation is performed"

  force_deallocate_morpho_market_v1_adapter_v2:
    calls:
      - description: "Encode MorphoMarketV1AdapterV2 adapter data"
        target: "${inputs.vault_v2_calldata_encoder}"
        selector: "encodeMorphoMarketV1AdapterV2Data((address,address,address,address,uint256))"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value:
              - type: "address"
                value: "${input_slots.loan_token}"
              - type: "address"
                value: "${input_slots.collateral_token}"
              - type: "address"
                value: "${input_slots.oracle}"
              - type: "address"
                value: "${input_slots.irm}"
              - type: "uint256"
                value: "${input_slots.lltv}"
        return:
          name: "adapter_data"
          type: "bytes"

      - description: "Force deallocate assets for in-kind redemption via MorphoMarketV1AdapterV2"
        target: "${inputs.vault_address}"
        selector: "forceDeallocate(address,bytes,uint256,address)"
        parameters:
          - type: "address"
            value: "${input_slots.adapter}"
          - type: "bytes"
            value: "${returns.adapter_data}"
          - type: "uint256"
            value: "${input_slots.assets}"
          - type: "address"
            value: "${input_slots.on_behalf_of}"
    input_slots:
      adapter:
        type: "address"
        description: "MorphoMarketV1AdapterV2 address"
      loan_token:
        type: "address"
        description: "Morpho market loan token"
      collateral_token:
        type: "address"
        description: "Morpho market collateral token"
      oracle:
        type: "address"
        description: "Morpho market oracle"
      irm:
        type: "address"
        description: "Morpho market IRM"
      lltv:
        type: "uint256"
        description: "Morpho market LLTV"
      assets:
        type: "uint256"
        description: "Asset amount to force deallocate"
      on_behalf_of:
        type: "address"
        description: "Account on whose behalf the deallocation is performed"

  accrue_interest:
    calls:
      - description: "Accrue vault interest and mint fee shares if any"
        target: "${inputs.vault_address}"
        selector: "accrueInterest()"
        parameters: []
