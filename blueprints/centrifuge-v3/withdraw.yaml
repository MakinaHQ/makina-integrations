protocol: "centrifuge-v3"

# Centrifuge V3 ERC-7540 AsyncVault — asynchronous, operator-settled redemption.
# Mirror of blueprints/centrifuge-v3/deposit.yaml, with ONE asymmetry that matters for
# accounting: the shares LEAVE the caliber at step 1 but are not destroyed until step 3.
#
#   1. [caliber]  request_redeem  -> shares to the pool escrow, ESCROWED NOT BURNED
#   2. [operator] approveRedeems   -> epoch sealed, no token movement
#   3. [operator] revokeShares     -> THE BURN (pool escrow -> AsyncRequestManager ->
#                                     BalanceSheet -> 0x0); redeemPrice fixed HERE,
#                                     assets reserved in the pool escrow
#   4. [caliber]  claim_redeem     -> assets pool escrow -> caliber (nothing burned)
#
# ## NO share approval on the request
# ShareToken._transferFrom guards its ENTIRE allowance path with `if (from != sender)`, and
# requestRedeem(shares, caliber, caliber) from the caliber gives sender == from == caliber,
# so the branch never executes and no allowance is read. An approve here would be dead code.
# Structural, not observational — the deposit side is genuinely asymmetric and DOES need its
# approval.
#
# ## No one-in-flight guard
# requestRedeem does `state.pendingRedeemRequest += shares_` — repeat requests accumulate
# into the same epoch bucket rather than reverting. The only blocking condition is a pending
# CANCELLATION (CancellationIsPending), which this integration never initiates.
#
# ## No slippage floor is POSSIBLE
# redeemPrice is written by the operator in step 3, after our request is mined. See the
# deposit.yaml header — same reasoning, same mitigation (position sizing).
#
# Expected inputs (from instructions/centrifuge-v3-redemption.yaml):
#   caliber_address — request owner + controller, claim receiver, position holder
#   vault_address   — the AsyncVault
#   share_address   — the vault's share(); read for the relative variant's balance only,
#                     never approved

constants:
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"
  boolean_helper_address:
    type: "address"
    value: "0x00c93e3b09Ca2f544487d4298339765EadCD8353"

inputs:
  caliber_address:
    type: "address"
  vault_address:
    type: "address"
  share_address:
    type: "address"

actions:
  # ── Step 1, absolute: request redemption of an exact share amount ────────────
  request_redeem:
    calls:
      - description: "Request the async redemption — shares move to the pool escrow (privileged transfer, no allowance), NOT burned yet"
        target: "${inputs.vault_address}"
        selector: "requestRedeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${input_slots.share_amount}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"

    input_slots:
      share_amount:
        type: "uint256"
        description: "Exact amount of shares to request redemption for"

  # ── Step 1, relative: request a bps fraction of the caliber's share balance ──
  request_redeem_relative:
    calls:
      - description: "Read the caliber's share balance"
        target: "${inputs.share_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "share_balance"
          type: "uint256"

      - description: "Compute share amount = balance * bps / 10000"
        target: "${constants.math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.share_balance}"
          - type: "uint256"
            value: "${input_slots.bps_to_redeem}"
          - type: "uint256"
            value: "10000"
        return:
          name: "share_amount"
          type: "uint256"

      - description: "Request the async redemption — shares move to the pool escrow, NOT burned yet"
        target: "${inputs.vault_address}"
        selector: "requestRedeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${returns.share_amount}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"

    input_slots:
      bps_to_redeem:
        type: "uint256"
        description: "Basis points of the caliber's share balance to redeem (10000 = 100%)"

  # ── Step 4: claim the assets the operator has already reserved ───────────────
  #
  # Pull-only. Claims the FULL entitlement.
  #
  # ## Why withdraw(maxWithdraw) and NOT redeem(maxRedeem)
  # The exact mirror of claim_deposit's mint-vs-deposit argument: withdraw(assets) passes
  # one amount as both of _processRedeem's bounds and drives state.maxWithdraw to exactly 0,
  # while redeem(shares) rounds the two apart and destroys 1 unit whenever the conversion has
  # a remainder.
  #
  # maxWithdraw is hook-gated the same way maxMint is, so a de-whitelisted caliber reverts on
  # the gt guard rather than deeper in the call; the assets stay reserved in the pool escrow.
  claim_redeem:
    calls:
      - description: "Read the claimable asset entitlement (0 unless the operator has revoked shares)"
        target: "${inputs.vault_address}"
        selector: "maxWithdraw(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "claimable_assets"
          type: "uint256"

      - description: "has_claimable = (claimable assets > 0)"
        target: "${constants.math_helper_address}"
        selector: "gt(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.claimable_assets}"
          - type: "uint256"
            value: "0"
        return:
          name: "has_claimable"
          type: "bool"

      - description: "Revert on a no-op claim rather than burning a management call silently"
        target: "${constants.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.has_claimable}"

      - description: "Claim: release the reserved assets from the pool escrow to the caliber (exact, maxWithdraw -> 0)"
        target: "${inputs.vault_address}"
        selector: "withdraw(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${returns.claimable_assets}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"
