protocol: "centrifuge-v3"

# Centrifuge V3 (ERC-7540 AsyncVault) — REDEEM side.
#
# Mirror of blueprints/centrifuge-v3/deposit.yaml, with ONE asymmetry that matters for
# accounting: the shares leave the caliber at step 1 but are not destroyed until step 3.
#
# ## Four-step lifecycle (only steps 1 and 4 are ours)
#   1. [caliber] request_redeem            -> shares to PoolEscrow, ESCROWED not burned
#   2. [operator] approveRedeems            -> epoch sealed, no token moves
#   3. [operator] revokeShares/notifyRedeem -> THE BURN (PoolEscrow -> AsyncRequestManager
#                                              -> BalanceSheet -> 0x0), asset reserved
#   4. [caliber] claim_redeem              -> asset PoolEscrow -> caliber (nothing burned)
# Verified on mainnet: JAAA 300,000 shares -> 313,817.221881 USDC at pricePoolPerShare
# 1.046057406271141, exact (tx 0x674d099c…, 0xb5337e6a…, 0x36015681…).
#
# ## No share approval on the request
# The observed on-chain requestRedeem emitted NO Approval and consumed no allowance: the
# BalanceSheet is a ward on the share token and moves it with a privileged transfer, not
# ERC20 transferFrom. This blueprint therefore omits an approve.
# >> FORK-VERIFY: confirm request_redeem succeeds with zero share allowance outstanding
#    before this ships. If it does not, add `share.approve(vault, amount)` ahead of the
#    requestRedeem call in BOTH variants.
#
# ## claim_redeem uses redeem(maxRedeem), not withdraw(maxWithdraw)
# Both are valid ERC-7540 exits, but redeem() consumes the claimable SHARE amount exactly
# and is what the VaultRouter's claimRedeem does — withdraw() rounds on the asset side and
# can strand share dust in the escrow.
#
# ## No one-in-flight guard
# ERC-7540 accumulates repeat requests into the same epoch bucket rather than reverting
# (unlike wYLDS, which reverts RedemptionAlreadyPending and forced the guard in
# blueprints/prime-swap/withdraw.yaml). Concurrent requests are additive and the accounting
# in blueprints/centrifuge-v3/account.yaml values them correctly, so no guard is needed.
#
# Expected inputs (from instructions/centrifuge-v3-redemption.yaml).

inputs:
  vault_address:
    type: "address"
  share_address:
    type: "address"
  caliber_address:
    type: "address"
  unsigned_math_helper_address:
    type: "address"
  caliber_helper_address:
    type: "address"
  boolean_helper_address:
    type: "address"

actions:
  # Absolute variant: request redemption of an exact amount of shares.
  request_redeem:
    calls:
      - description: "Request the async redemption — shares move to the PoolEscrow, NOT burned yet"
        target: "${inputs.vault_address}"
        selector: "requestRedeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${input_slots.share_amount}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"

    input_slots:
      share_amount:
        type: "uint256"
        description: "Exact amount of vault shares (6-dec) to request redemption for"

  # Relative variant: request redemption of a basis-points fraction of the caliber's shares.
  request_redeem_relative:
    calls:
      - description: "Read the caliber's share balance"
        target: "${inputs.share_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "share_balance"
          type: "uint256"

      - description: "Compute share amount = balance * bps / 10000"
        target: "${inputs.unsigned_math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.share_balance}"
          - type: "uint256"
            value: "${input_slots.bps_to_redeem}"
          - type: "uint256"
            value: "10000"
        return:
          name: "share_amount"
          type: "uint256"

      - description: "Request the async redemption — shares move to the PoolEscrow, NOT burned yet"
        target: "${inputs.vault_address}"
        selector: "requestRedeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${returns.share_amount}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"

    input_slots:
      bps_to_redeem:
        type: "uint256"
        description: "Basis points of the caliber's share balance to redeem (10000 = 100%)"

  # Claim the asset the operator has already reserved in the PoolEscrow (step 4).
  # Pull-only. Claims the FULL claimable amount.
  claim_redeem:
    calls:
      - description: "Read the claimable share amount (0 unless the operator has revoked shares)"
        target: "${inputs.vault_address}"
        selector: "maxRedeem(address)"
        parameters:
          - type: "address"
            value: "${inputs.caliber_address}"
        return:
          name: "claimable_shares"
          type: "uint256"

      - description: "has_claimable = (claimable shares > 0)"
        target: "${inputs.caliber_helper_address}"
        selector: "gt(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.claimable_shares}"
          - type: "uint256"
            value: "0"
        return:
          name: "has_claimable"
          type: "bool"

      - description: "Revert on a no-op claim rather than burning a management call silently"
        target: "${inputs.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.has_claimable}"

      - description: "Claim: release the reserved asset from the PoolEscrow to the caliber"
        target: "${inputs.vault_address}"
        selector: "redeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${returns.claimable_shares}"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "address"
            value: "${inputs.caliber_address}"
