protocol: "uniswapX"

inputs:
  reactor:
    type: "address"
  aave_pool_instance:
    type: "address"
  usdc:
    type: "address"
  safe_address:
    type: "address"
  xstock_token:
    type: "address"

actions:
  buy_xstock_with_usdc_direct:
    calls:
      - description: "Approve the Reactor to pull USDC from the Safe"
        target: "${inputs.usdc}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${inputs.reactor}"
          - type: "uint256"
            value: "${input_slots.usdc_amount}"

      - description: "Execute Uniswap X order"
        target: "${inputs.reactor}"
        selector: "execute((bytes,bytes))"
        parameters:
          - type: "(bytes,bytes)"
            value:
              - type: "bytes"
                value: "${input_slots.order}"
              - type: "bytes"
                value: "${input_slots.signature}"
    input_slots:
      order:
        type: "bytes"
        description: "Encoded Uniswap X order bytes"
      signature:
        type: "bytes"
        description: "Uniswap X order signature bytes"
      usdc_amount:
        type: "uint256"
        description: "USDC amount approved for the Reactor"

  buy_xstock_with_usdc_from_aave:
    calls:
      - description: "Withdraw USDC from Aave to the Safe"
        target: "${inputs.aave_pool_instance}"
        selector: "withdraw(address,uint256,address)"
        parameters:
          - type: "address"
            value: "${inputs.usdc}"
          - type: "uint256"
            value: "${input_slots.usdc_amount}"
          - type: "address"
            value: "${inputs.safe_address}"

      - description: "Approve the Reactor to pull USDC from the Safe"
        target: "${inputs.usdc}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${inputs.reactor}"
          - type: "uint256"
            value: "${input_slots.usdc_amount}"

      - description: "Execute Uniswap X order"
        target: "${inputs.reactor}"
        selector: "execute((bytes,bytes))"
        parameters:
          - type: "(bytes,bytes)"
            value:
              - type: "bytes"
                value: "${input_slots.order}"
              - type: "bytes"
                value: "${input_slots.signature}"
    input_slots:
      order:
        type: "bytes"
        description: "Encoded Uniswap X order bytes"
      signature:
        type: "bytes"
        description: "Uniswap X order signature bytes"
      usdc_amount:
        type: "uint256"
        description: "USDC amount to withdraw from Aave and approve for the Reactor"

  sell_xstock_for_usdc_direct:
    calls:
      - description: "Approve the Reactor to pull xStock from the Safe"
        target: "${inputs.xstock_token}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${inputs.reactor}"
          - type: "uint256"
            value: "${input_slots.xstock_amount}"

      - description: "Execute Uniswap X order"
        target: "${inputs.reactor}"
        selector: "execute((bytes,bytes))"
        parameters:
          - type: "(bytes,bytes)"
            value:
              - type: "bytes"
                value: "${input_slots.order}"
              - type: "bytes"
                value: "${input_slots.signature}"
    input_slots:
      order:
        type: "bytes"
        description: "Encoded Uniswap X order bytes"
      signature:
        type: "bytes"
        description: "Uniswap X order signature bytes"
      xstock_amount:
        type: "uint256"
        description: "xStock amount approved for the Reactor"
