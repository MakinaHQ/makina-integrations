protocol: "midas"

# Midas mToken Redemption Vault — async request blueprint (all Midas positions).
#
# Async, admin-settled redemption: caliber calls redeemRequest now (escrows mToken
# in the vault contract) and later the Midas admin calls approveRequest which pushes
# token-out directly to the recipient (= caliber). There is NO on-chain claim function
# callable by the caliber or the recipient; settlement is detected via the request's
# status field, so consumers pair this with an ACCOUNTING action and no claim action.
#
# ## KV stores the raw requestId (no sentinel offset)
# The KV holds the raw `requestId` returned by `redeemRequest`. The value 0 is
# ambiguous in isolation (could mean "never written" OR "tracking real id 0"), so we
# disambiguate by reading the request struct and requiring BOTH:
#   in_flight  iff  request.status == Pending(0)  AND  request.sender == caliber
# Matching on the caliber (rather than merely `sender != 0`) matters: a zero KV points
# at request id 0, which on a shared vault is a REAL request owned by a third party.
# Testing only `sender != 0` would treat a stranger's Pending request as our own.
#
# ## One-in-flight invariant per KV key
# The vault itself permits multiple concurrent Pending requests per caller (verified on
# mainnet: redeemRequests(0..3) all share sender 0x19C1eB...721d). This blueprint
# enforces "max one Pending request per KV key" via the struct check above, and both
# actions of a position share one key, so a position has at most one request in flight.
# NOTE: the guard depends on the account flow keeping KV in sync — if account has not
# run since the last request settled, KV may still point at an id whose status is now
# Processed/Canceled, in which case the guard correctly reports NOT in-flight.
#
# ## A rejected request does NOT return the escrow on-chain — NAV writes it off
# `rejectRequest(id)` is onlyVaultAdmin and its whole body is: validate, set
# status = Canceled, emit RejectRequest. It performs NO mToken transfer. So the escrowed
# mToken stays in the vault contract, while on our side the ACCOUNTING action sees
# status != Pending, masks the position to 0 and clears the KV key — i.e. the machine
# instantly writes off the full escrowed amount (>= 1 mToken, ~$130k+ for mWIN) and loses
# its pointer to the request. Recovery is off the happy path: identify the amount from
# the RejectRequest / redeemRequests(id) record and have Midas return it via the vault's
# admin `withdrawToken`. Operationally: alert on RejectRequest and pause share
# issuance/redemption until the position is reconciled, because NAV is understated in the
# interim. Note this is distinct from a Processed request, where settlement pushes
# token-out to the recipient before the status flips.
#
# ## Recipient = caliber
# Use the 3-arg `redeemRequest(tokenOut, amountMTokenIn, recipient)` overload with
# recipient = caliber so settlement assets land directly on the caliber. Verified
# on the mWIN implementation (0xeb21db42...879c) that this overload RETURNS the assigned
# requestId (`redeemRequest(address,uint256,address) -> (uint256)`), so we persist the
# vault's own return value rather than pre-reading `currentRequestId()` and reasoning
# about the counter's pre/post-increment semantics.
#
# ## Operational prerequisites (verify per mToken before deployment)
# - Selector `redeemRequest(address,uint256,address)` = 0x15571a04 must be unpaused:
#   check `fnPaused(0x15571a04) == false` and `paused() == false` on the vault.
#   (mWIN redeemer 0x6057...7924: both false as of 2026-08-04.)
# - GREENLIST: the gate lives on the *mToken*, not the vault. mTokenPermissioned's
#   `_beforeTokenTransfer` calls `_onlyGreenlisted(from)` and `_onlyGreenlisted(to)`
#   UNCONDITIONALLY, so BOTH the caliber and the vault must hold the mToken's
#   greenlist role for the escrow transfer to succeed. Do NOT rely on the vault's
#   own `greenlistEnabled()` flag: that only gates the vault's `_validateUserAccess`
#   (`modifier onlyGreenlisted { if (greenlistEnabled) _onlyGreenlisted(account); }`)
#   and is currently false on the mWIN redeemer — the token-level check still applies.
#   For mWIN the role is M_WIN_GREENLISTED_ROLE (0xc7021654...acb2) on access control
#   0x0312A9D1...AC4B; the redeemer already holds it, the caliber must be granted it.
#   If Midas later revokes it while the caliber holds mToken, all new exit requests
#   are blocked while NAV keeps carrying the stranded mToken at its oracle price.
#
# ## TWO independent 1-mToken minimums constrain exit sizing (mWIN; verify per token)
# 1. Vault `minAmount`: `_calcAndValidateRedeem` does
#    `require(minAmount <= amountMTokenIn)` unless `isFreeFromMinAmount[caliber]`.
#    mWIN redeemer: minAmount = 1e18, i.e. every request must be >= 1 mWIN.
# 2. Token residual minimum: mTokenMinBalance's `_afterTokenTransfer` runs
#    `require(balance == 0 || balance >= 1 ether)` on BOTH `from` and `to` unless the
#    address holds the mToken's min-balance-exempt role. So a partial request that
#    would leave the caliber holding 0 < balance < 1 mToken reverts with
#    "MTMB: min balance not met". Granting the exemption to only one endpoint is
#    insufficient — the check runs on sender and recipient.
#    For mWIN the role is M_WIN_MIN_BALANCE_EXEMPT_ROLE (0x23e8bb45...27ab); as of
#    2026-08-04 NEITHER the caliber nor the redeemer holds it.
# Combined, for a caliber holding B mToken a request of size `a` needs
# `a >= 1` AND (`B - a == 0` OR `B - a >= 1`). For B < 2 the only legal exit is the
# FULL balance. `request_redemption_relative` with bps < 10000 therefore reverts
# whenever it would leave a sub-1 remainder — this is NOT guarded here, the operator
# must size the bps, and an undersized request fails inside Midas, not in the caliber.
#
# ## Flow
# 1. kv.get(key) → stored_id (raw uint256, NOT offset).
# 2. vault.redeemRequests(stored_id) → struct.
# 3. context_helper.msgSender() → caliber; revert only when the tracked tuple is
#    Pending AND its sender field equals that caliber.
# 4. (relative variant only) compute amount = balance * bps / 10000.
# 5. mToken.approve(vault, amount).
# 6. vault.redeemRequest(tokenOut, amount, caliber) → assigned request id.
# 7. kv.set(key, returned request id); never reconstruct vault id-allocation behaviour.

constants:
  context_helper_address:
    type: "address"
    value: "0x0f431322E1fF2500D4C5a4E090A7Da7344F953BE" # Makina ContextHelper; blueprint-helpers.md
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0" # Makina MathHelper; blueprint-helpers.md
  boolean_helper_address:
    type: "address"
    value: "0x00c93e3b09Ca2f544487d4298339765EadCD8353" # Makina BooleanHelper; blueprint-helpers.md
  bytes32_helper_address:
    type: "address"
    value: "0x74DC739B8F98ad0F76Cd8900695DD8D5083E45D3" # Makina Bytes32Helper; blueprint-helpers.md
  caliber_helper_address:
    type: "address"
    value: "0x6E2ED2f457c41F38556Ab0c2b1185cc9e6563d8D" # Makina CaliberHelper; blueprint-helpers.md

inputs:
  redeemer_address:
    type: "address"
  mtoken_address:
    type: "address"
  token_out_address:
    type: "address"
  kv_store_address:
    type: "address"
  kv_storage_key:
    type: "bytes32"

actions:
  # Absolute variant: caller specifies an exact mToken amount to redeem.
  request_redemption:
    calls:
      # ---- Guard: no in-flight request -----------------------------------
      - description: "Get previously tracked requestId from KV store (raw id; 0 is ambiguous)"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.kv_storage_key}"
        return:
          name: "tracked_request_id"
          type: "uint256"

      - description: "Read redeemRequests(tracked_id) — (sender, tokenOut, status, amountMToken, mTokenRate, tokenOutRate)"
        target: "${inputs.redeemer_address}"
        selector: "redeemRequests(uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.tracked_request_id}"
        return:
          name: "tracked_request_tuple"
          type: "(address,address,uint8,uint256,uint256,uint256)"

      - description: "Extract sender (index 0) as bytes32 for the ownership check"
        target: "${constants.caliber_helper_address}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,uint8,uint256,uint256,uint256)"
            value: "${returns.tracked_request_tuple}"
          - type: "uint256"
            value: "0"
        return:
          name: "tracked_sender_b32"
          type: "bytes32"

      - description: "Extract status (index 2)"
        target: "${constants.caliber_helper_address}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,uint8,uint256,uint256,uint256)"
            value: "${returns.tracked_request_tuple}"
          - type: "uint256"
            value: "2"
        return:
          name: "tracked_status"
          type: "uint256"

      - description: "status == 0 (Pending)"
        target: "${constants.math_helper_address}"
        selector: "eq(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.tracked_status}"
          - type: "uint256"
            value: "0"
        return:
          name: "tracked_status_is_pending"
          type: "bool"

      - description: "Get caliber address word for ownership check"
        target: "${constants.context_helper_address}"
        selector: "msgSender()"
        parameters: []
        return:
          name: "caliber_address_b32"
          type: "bytes32"

      - description: "Tracked request sender equals the executing caliber"
        target: "${constants.bytes32_helper_address}"
        selector: "eq(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${returns.tracked_sender_b32}"
          - type: "bytes32"
            value: "${returns.caliber_address_b32}"
        return:
          name: "tracked_sender_is_caliber"
          type: "bool"

      - description: "in_flight = Pending AND owned by caliber; revert if true"
        target: "${constants.boolean_helper_address}"
        selector: "and(bool,bool)"
        parameters:
          - type: "bool"
            value: "${returns.tracked_status_is_pending}"
          - type: "bool"
            value: "${returns.tracked_sender_is_caliber}"
        return:
          name: "tracked_is_in_flight"
          type: "bool"

      - description: "Enforce one-in-flight invariant"
        target: "${constants.boolean_helper_address}"
        selector: "revertIfTrue(bool)"
        parameters:
          - type: "bool"
            value: "${returns.tracked_is_in_flight}"

      - description: "Get caliber address as redemption recipient"
        target: "${constants.context_helper_address}"
        selector: "msgSender()"
        parameters: []
        return:
          name: "caliber_address"
          type: "address"

      # ---- Approve + submit ----------------------------------------------
      - description: "Approve mToken spending by the vault"
        target: "${inputs.mtoken_address}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${inputs.redeemer_address}"
          - type: "uint256"
            value: "${input_slots.amount_mtoken_in}"

      - description: "Submit redeem request (3-arg overload — recipient = caliber)"
        target: "${inputs.redeemer_address}"
        selector: "redeemRequest(address,uint256,address)"
        parameters:
          - type: "address"
            value: "${inputs.token_out_address}"
          - type: "uint256"
            value: "${input_slots.amount_mtoken_in}"
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "submitted_request_id"
          type: "uint256"

      - description: "Store vault-returned request id in KV (account resets it after settlement)"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.kv_storage_key}"
          - type: "uint256"
            value: "${returns.submitted_request_id}"

    input_slots:
      amount_mtoken_in:
        type: "uint256"
        description: "Exact mToken amount (18 dec) to redeem; must satisfy both 1-mToken minimums (see header)"

  # Relative variant: caller specifies a basis-points fraction of the caliber's
  # mToken balance to redeem. See the header: bps values that leave a sub-1-mToken
  # remainder revert inside Midas, they are not guarded here.
  request_redemption_relative:
    calls:
      # ---- Guard: no in-flight request (see request_redemption for rationale) ----
      - description: "Get previously tracked requestId from KV store (raw id; 0 is ambiguous)"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.kv_storage_key}"
        return:
          name: "tracked_request_id"
          type: "uint256"

      - description: "Read redeemRequests(tracked_id) — (sender, tokenOut, status, amountMToken, mTokenRate, tokenOutRate)"
        target: "${inputs.redeemer_address}"
        selector: "redeemRequests(uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.tracked_request_id}"
        return:
          name: "tracked_request_tuple"
          type: "(address,address,uint8,uint256,uint256,uint256)"

      - description: "Extract sender (index 0) as bytes32 for the ownership check"
        target: "${constants.caliber_helper_address}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,uint8,uint256,uint256,uint256)"
            value: "${returns.tracked_request_tuple}"
          - type: "uint256"
            value: "0"
        return:
          name: "tracked_sender_b32"
          type: "bytes32"

      - description: "Extract status (index 2)"
        target: "${constants.caliber_helper_address}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,uint8,uint256,uint256,uint256)"
            value: "${returns.tracked_request_tuple}"
          - type: "uint256"
            value: "2"
        return:
          name: "tracked_status"
          type: "uint256"

      - description: "status == 0 (Pending)"
        target: "${constants.math_helper_address}"
        selector: "eq(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.tracked_status}"
          - type: "uint256"
            value: "0"
        return:
          name: "tracked_status_is_pending"
          type: "bool"

      - description: "Get caliber address word for ownership check"
        target: "${constants.context_helper_address}"
        selector: "msgSender()"
        parameters: []
        return:
          name: "caliber_address_b32"
          type: "bytes32"

      - description: "Tracked request sender equals the executing caliber"
        target: "${constants.bytes32_helper_address}"
        selector: "eq(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${returns.tracked_sender_b32}"
          - type: "bytes32"
            value: "${returns.caliber_address_b32}"
        return:
          name: "tracked_sender_is_caliber"
          type: "bool"

      - description: "in_flight = Pending AND owned by caliber; revert if true"
        target: "${constants.boolean_helper_address}"
        selector: "and(bool,bool)"
        parameters:
          - type: "bool"
            value: "${returns.tracked_status_is_pending}"
          - type: "bool"
            value: "${returns.tracked_sender_is_caliber}"
        return:
          name: "tracked_is_in_flight"
          type: "bool"

      - description: "Enforce one-in-flight invariant"
        target: "${constants.boolean_helper_address}"
        selector: "revertIfTrue(bool)"
        parameters:
          - type: "bool"
            value: "${returns.tracked_is_in_flight}"

      - description: "Get caliber address as redemption recipient"
        target: "${constants.context_helper_address}"
        selector: "msgSender()"
        parameters: []
        return:
          name: "caliber_address"
          type: "address"

      # ---- Compute amount from bps ---------------------------------------
      - description: "Read caliber's mToken balance"
        target: "${inputs.mtoken_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "mtoken_balance"
          type: "uint256"

      - description: "Compute amount = balance * bps / 10000"
        target: "${constants.math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.mtoken_balance}"
          - type: "uint256"
            value: "${input_slots.bps_to_redeem}"
          - type: "uint256"
            value: "10000"
        return:
          name: "amount_mtoken_in"
          type: "uint256"

      # ---- Approve + submit ----------------------------------------------
      - description: "Approve mToken spending by the vault"
        target: "${inputs.mtoken_address}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${inputs.redeemer_address}"
          - type: "uint256"
            value: "${returns.amount_mtoken_in}"

      - description: "Submit redeem request (3-arg overload — recipient = caliber)"
        target: "${inputs.redeemer_address}"
        selector: "redeemRequest(address,uint256,address)"
        parameters:
          - type: "address"
            value: "${inputs.token_out_address}"
          - type: "uint256"
            value: "${returns.amount_mtoken_in}"
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "submitted_request_id"
          type: "uint256"

      - description: "Store vault-returned request id in KV (account resets it after settlement)"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.kv_storage_key}"
          - type: "uint256"
            value: "${returns.submitted_request_id}"

    input_slots:
      bps_to_redeem:
        type: "uint256"
        description: "Basis points of caliber's mToken balance to redeem (10000 = 100%); must leave 0 or >= 1 mToken"
