protocol: "morpho"

constants:
  morpho:
    type: "address"
    value: "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
  market_id_eusd_0xf9ed_74bf:
    type: "bytes32"
    value: "0xf9ed1dba3b6ba1ede10e2115a9554e9c52091c9f1b1af21f9e0fecc855ee74bf"
  loan_token_eusd_0xf9ed_74bf:
    type: "address"
    value: "0xCfA3Ef56d303AE4fAabA0592388F19d7C3399FB4"
  executor_helper:
    type: "address"
    value: "0xC62d6FDC4e77C4d006784bc4805703b37fFCc4b7"

inputs:
  caliber_address:
    type: "address"

actions:
  repay_asset:
    calls:
      - description: "Get market parameters from market ID"
        target: "${constants.morpho}"
        selector: "idToMarketParams(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${constants.market_id_eusd_0xf9ed_74bf}"
        return:
          name: "market_params"
          type: "(address,address,address,address,uint256)"

      - description: "Extract loan token from market params"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value: "${returns.market_params}"
          - type: "uint256"
            value: "0"
        return:
          name: "loan_token"
          type: "address"

      - description: "Extract collateral token from market params"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value: "${returns.market_params}"
          - type: "uint256"
            value: "1"
        return:
          name: "collateral_token"
          type: "address"

      - description: "Extract oracle from market params"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value: "${returns.market_params}"
          - type: "uint256"
            value: "2"
        return:
          name: "oracle"
          type: "address"

      - description: "Extract IRM from market params"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value: "${returns.market_params}"
          - type: "uint256"
            value: "3"
        return:
          name: "irm"
          type: "address"

      - description: "Extract LLTV from market params"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value: "${returns.market_params}"
          - type: "uint256"
            value: "4"
        return:
          name: "lltv"
          type: "uint256"

      - description: "Approve loan token for spending"
        target: "${constants.loan_token_eusd_0xf9ed_74bf}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${constants.morpho}"
          - type: "uint256"
            value: "${input_slots.amount_to_repay}"

      - description: "Repay loan on Morpho"
        target: "${constants.morpho}"
        selector: "repay((address,address,address,address,uint256),uint256,uint256,address,bytes)"
        parameters:
          - type: "(address,address,address,address,uint256)"
            value:
              - type: "address"
                value: "${returns.loan_token}"
              - type: "address"
                value: "${returns.collateral_token}"
              - type: "address"
                value: "${returns.oracle}"
              - type: "address"
                value: "${returns.irm}"
              - type: "uint256"
                value: "${returns.lltv}"
          - type: "uint256"
            value: "${input_slots.amount_to_repay}"
          - type: "uint256"
            value: "0"
          - type: "address"
            value: "${inputs.caliber_address}"
          - type: "bytes"
            value: "0x"

    input_slots:
      amount_to_repay:
        type: "uint256"
        description: "The amount of loan token to repay"
