protocol: "morpho"

constants:
  morpho_contract:
    type: "address"
    value: "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
  executor_helper:
    type: "address"
    value: "0xC62d6FDC4e77C4d006784bc4805703b37fFCc4b7"
  unsigned_math:
    type: "address"
    value: "0x16D120a18334e273FA3C029Ece56bfA5A2ABFCFd"

inputs:
  market_id:
    type: "bytes32"
  subject:
    type: "address"

actions:
  account_collateral:
    calls:
      - description: "Get user position in the market"
        target: "${constants.morpho_contract}"
        selector: "position(bytes32,address)"
        parameters:
          - type: "bytes32"
            value: "${inputs.market_id}"
          - type: "address"
            value: "${inputs.subject}"
        return:
          name: "position_data"
          type: "(uint256,uint128,uint128)"

      - description: "Extract collateral shares (index 2)"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(uint256,uint128,uint128)"
            value: "${returns.position_data}"
          - type: "uint256"
            value: "2"
        return:
          name: "collateral_shares"
          type: "uint256"

    reserved_slots:
      - type: "uint256"
        value: "${returns.collateral_shares}"
      - type: "uint256"
        value: "${builtins.UINT256_MAX}"

  account_debt:
    calls:
      - description: "Get user position in the market"
        target: "${constants.morpho_contract}"
        selector: "position(bytes32,address)"
        parameters:
          - type: "bytes32"
            value: "${inputs.market_id}"
          - type: "address"
            value: "${inputs.subject}"
        return:
          name: "position_data"
          type: "(uint256,uint128,uint128)"

      - description: "Extract borrow shares (index 1)"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(uint256,uint128,uint128)"
            value: "${returns.position_data}"
          - type: "uint256"
            value: "1"
        return:
          name: "borrow_shares"
          type: "uint256"

      - description: "Get market state"
        target: "${constants.morpho_contract}"
        selector: "market(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.market_id}"
        return:
          name: "market_data"
          type: "(uint128,uint128,uint128,uint128,uint128,uint128)"

      - description: "Extract total borrow shares (index 3)"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(uint128,uint128,uint128,uint128,uint128,uint128)"
            value: "${returns.market_data}"
          - type: "uint256"
            value: "3"
        return:
          name: "total_borrow_shares"
          type: "uint256"

      - description: "Extract total borrow assets (index 2)"
        target: "${constants.executor_helper}"
        selector: "extractElementFromStaticTuple(bytes,uint256)"
        parameters:
          - type: "(uint128,uint128,uint128,uint128,uint128,uint128)"
            value: "${returns.market_data}"
          - type: "uint256"
            value: "2"
        return:
          name: "total_borrow_assets"
          type: "uint256"

      - description: "Calculate debt amount: shares * totalAssets / totalShares"
        target: "${constants.unsigned_math}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.borrow_shares}"
          - type: "uint256"
            value: "${returns.total_borrow_assets}"
          - type: "uint256"
            value: "${returns.total_borrow_shares}"
        return:
          name: "debt_amount"
          type: "uint256"

    reserved_slots:
      - type: "uint256"
        value: "${returns.debt_amount}"
      - type: "uint256"
        value: "${builtins.UINT256_MAX}"
