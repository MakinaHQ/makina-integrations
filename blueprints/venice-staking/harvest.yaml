protocol: "venice-staking"

# Venice AI sVVV reward claim.
#
# `claim()` transfers any pending VVV rewards to msg.sender (the caliber)
# and updates rewardDebt. Safe to call at any time, including during
# cooldown (V2 removed the cooldown guard from _claim).

inputs:
  staking_contract_address:
    type: "address"

actions:
  claim:
    calls:
      - description: "Claim pending VVV rewards to the caliber"
        target: "${inputs.staking_contract_address}"
        selector: "claim()"
        parameters: []
