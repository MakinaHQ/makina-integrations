protocol: "fission"

constants:
  manager_address:
    type: "address"
    value: "0x1746d7978639627e6710312CF8830f53d4C2C770"
  usdc_address:
    type: "address"
    value: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
  oracle_registry_address:
    type: "address"
    value: "0xC388B72AB90Be82B230D919F9C05c87F9397f485"
  math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"
  bytes32_helper_address:
    type: "address"
    value: "0x74DC739B8F98ad0F76Cd8900695DD8D5083E45D3"
  boolean_helper_address:
    type: "address"
    value: "0x00c93e3b09Ca2f544487d4298339765EadCD8353"

inputs:
  token_address:
    type: "address"
  token_unit:
    type: "uint256"
  max_discount_bps:
    type: "uint256"

actions:
  redeem:
    calls:
      - description: "Read the redemption terms: (valid, (redeemer, settlementAmount, tokenAmount, tokenAddress, expiresTime))"
        target: "${constants.manager_address}"
        selector: "getRedemptionTerms(uint256)"
        parameters:
          - type: "uint256"
            value: "${input_slots.redemption_id}"
        return:
          name: "terms"
          type: "(bool,(address,uint256,uint256,address,uint256))"

      - description: "Extract settlementAmount (word 2)"
        target: "${constants.bytes32_helper_address}"
        selector: "getTupleWord(bytes,uint256)"
        parameters:
          - type: "(bool,(address,uint256,uint256,address,uint256))"
            value: "${returns.terms}"
          - type: "uint256"
            value: "2"
        return:
          name: "settlement_amount"
          type: "uint256"

      - description: "Extract tokenAmount (word 3)"
        target: "${constants.bytes32_helper_address}"
        selector: "getTupleWord(bytes,uint256)"
        parameters:
          - type: "(bool,(address,uint256,uint256,address,uint256))"
            value: "${returns.terms}"
          - type: "uint256"
            value: "3"
        return:
          name: "token_amount"
          type: "uint256"

      - description: "Oracle price of 1 whole token in USDC wei"
        target: "${constants.oracle_registry_address}"
        selector: "getPrice(address,address)"
        parameters:
          - type: "address"
            value: "${inputs.token_address}"
          - type: "address"
            value: "${constants.usdc_address}"
        return:
          name: "price"
          type: "uint256"

      - description: "Oracle value of the redeemed tokens: token_amount * price / token_unit"
        target: "${constants.math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.token_amount}"
          - type: "uint256"
            value: "${returns.price}"
          - type: "uint256"
            value: "${inputs.token_unit}"
        return:
          name: "oracle_value"
          type: "uint256"

      - description: "min_payout_bps = 10000 - max_discount_bps"
        target: "${constants.math_helper_address}"
        selector: "sub(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "10000"
          - type: "uint256"
            value: "${inputs.max_discount_bps}"
        return:
          name: "min_payout_bps"
          type: "uint256"

      - description: "min_settlement = oracle_value * min_payout_bps / 10000"
        target: "${constants.math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.oracle_value}"
          - type: "uint256"
            value: "${returns.min_payout_bps}"
          - type: "uint256"
            value: "10000"
        return:
          name: "min_settlement"
          type: "uint256"

      - description: "Check settlement_amount >= min_settlement"
        target: "${constants.math_helper_address}"
        selector: "gte(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.settlement_amount}"
          - type: "uint256"
            value: "${returns.min_settlement}"
        return:
          name: "discount_ok"
          type: "bool"

      - description: "Revert if Fission's discount exceeds max_discount_bps"
        target: "${constants.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.discount_ok}"

      - description: "Approve exactly tokenAmount of the configured token to the manager"
        target: "${inputs.token_address}"
        selector: "approve(address,uint256)"
        parameters:
          - type: "address"
            value: "${constants.manager_address}"
          - type: "uint256"
            value: "${returns.token_amount}"

      - description: "Fulfill: the manager pulls the tokens to Fission and sends settlementAmount USDC to the caliber"
        target: "${constants.manager_address}"
        selector: "fulfillRedemption(uint256)"
        parameters:
          - type: "uint256"
            value: "${input_slots.redemption_id}"

    input_slots:
      redemption_id:
        type: "uint256"
        description: "Fission onchain_id of a redemption started with the caliber as redeemer"
