protocol: "royco-jt-dmg"

# Royco Junior Tranche DMG Claim Blueprint (async withdraw leg 2)
# Single transaction, run AFTER the redeemer's finalizationDelay() + off-chain keeper finalizeRequests:
#   1. KV get(requestId_key) -> requestId
#   2. AsyncRedeemer.claimAssets(requestId) -> USDC to caliber (NFT burned)
#   3. KV reset(requestId_key); KV reset(pending_mt_key)
# Identical to blueprints/royco/st-dmg/claim.yaml (same DMG-machine AsyncRedeemer); only the
# protocol name differs. Clones blueprints/makina/redeem.yaml:claim_assets verbatim.
#
# Fee: the AsyncRedeemerFee pays convertToAssets(mt) * (1 - redeemFeeRate) (1e18 scale; 1.3% at
# the switch, capped by maxRedeemFeeRate = 5%), while account.yaml values the pending MT pre-fee.
# This claim therefore books the fee as a position-decrease loss, which the Caliber bounds by
# maxPositionDecreaseLossBps (500 on dusd): a fee above ~4.7% makes this claim revert.

constants:
  # DMG_machine.redeemer(): an AsyncRedeemerFee (replaced the fee-less AsyncRedeemer
  # 0x21a9C31825FA1D8Bf5F2378A3C95E823290B0637). Same ABI; fee note in the header.
  async_redeemer_address:
    type: "address"
    value: "0xc4ecAf359a6174f9651C5Fcd7b6Fe9ae6b682Ca5"

inputs:
  kv_store_address:
    type: "address"
  redemption_request_id_storage_key:
    type: "bytes32"
  pending_redemption_mt_storage_key:
    type: "bytes32"

actions:
  claim_assets:
    calls:
      # 1. Retrieve the stored request ID
      - description: "Retrieve the stored request ID from the KV store"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.redemption_request_id_storage_key}"
        return:
          name: "request_id"
          type: "uint256"

      # 2. Claim the finalized redemption -> USDC
      - description: "Claim USDC from the finalized redeem request"
        target: "${constants.async_redeemer_address}"
        selector: "claimAssets(uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.request_id}"
        return:
          name: "assets_received"
          type: "uint256"

      # 3. Clear both KV slots so accounting stops counting the pending MT
      - description: "Clear the request ID from the KV store after claiming"
        target: "${inputs.kv_store_address}"
        selector: "reset(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.redemption_request_id_storage_key}"

      - description: "Clear the pending DMG MT amount from the KV store after claiming"
        target: "${inputs.kv_store_address}"
        selector: "reset(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.pending_redemption_mt_storage_key}"
