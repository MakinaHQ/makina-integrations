protocol: "royco-jt-syrupusdc"

# Royco Junior Tranche syrupUSDC Withdraw Blueprint
# Two-step manual withdrawal via Maple WithdrawalManager:
#   1. request_redeem - Redeem JT shares -> syrupUSDC -> requestRedeem (Maple queue).
#   2. USDC is airdropped later (need to run accounting to clear pendings).
# Mirrors blueprints/royco/st-syrupusdc/withdraw.yaml; only the tranche address differs.

constants:
  context_helper_address:
    type: "address"
    value: "0x0f431322E1fF2500D4C5a4E090A7Da7344F953BE"
  unsigned_math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"
  syrupusdc_address:
    type: "address"
    value: "0x80ac24aA929eaF5013f6436cdA2a7ba190f5Cc0b"
  junior_tranche_address:
    type: "address"
    value: "0x5f340b400f892bbfded2e5c316369dcbf05c282a"
  withdrawal_manager_address:
    type: "address"
    value: "0x1bc47a0Dd0FdaB96E9eF982fdf1F34DC6207cfE3"
  caliber_helper_address:
    type: "address"
    value: "0x6E2ED2f457c41F38556Ab0c2b1185cc9e6563d8D"
  boolean_helper_address:
    type: "address"
    value: "0x00c93e3b09Ca2f544487d4298339765EadCD8353"

inputs:
  # Per-position attribution of the caliber-wide Maple escrow (design A). See
  # blueprints/morpho-loop/maple/withdraw-maple-redeem-attributed.yaml for the
  # scheme, the `wT == sum(wP)` invariant and the key namespacing rules.
  kv_store_address:
    type: "address"
  maple_escrow_position_key:
    type: "bytes32"
  maple_escrow_total_key:
    type: "bytes32"

actions:
  request_redeem:
    calls:
      - description: "Get caliber's address"
        target: ${constants.context_helper_address}
        selector: "msgSender()"
        parameters: []
        return:
          name: "caliber_address"
          type: "address"

      - description: "Get Junior Tranche share balance"
        target: "${constants.junior_tranche_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "jt_shares"
          type: "uint256"

      - description: "Calculate shares to redeem based on basis points"
        target: "${constants.unsigned_math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.jt_shares}"
          - type: "uint256"
            value: "${input_slots.bps_to_redeem}"
          - type: "uint256"
            value: "10000"
        return:
          name: "shares_to_redeem"
          type: "uint256"

      - description: "Get syrupUSDC balance before JT redeem"
        target: "${constants.syrupusdc_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "syrupusdc_before"
          type: "uint256"

      - description: "Redeem Junior Tranche shares to receive syrupUSDC"
        target: "${constants.junior_tranche_address}"
        selector: "redeem(uint256,address,address)"
        parameters:
          - type: "uint256"
            value: "${returns.shares_to_redeem}"
          - type: "address"
            value: "${returns.caliber_address}"
          - type: "address"
            value: "${returns.caliber_address}"

      - description: "Get syrupUSDC balance after JT redeem"
        target: "${constants.syrupusdc_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "syrupusdc_after"
          type: "uint256"

      - description: "Calculate syrupUSDC received from JT redeem (after - before)"
        target: "${constants.unsigned_math_helper_address}"
        selector: "sub(uint256,uint256)" # sub(a, b) = a - b; pass (after, before) → after - before
        parameters:
          - type: "uint256"
            value: "${returns.syrupusdc_after}"
          - type: "uint256"
            value: "${returns.syrupusdc_before}"
        return:
          name: "syrupusdc_delta"
          type: "uint256"

      - description: "Request syrupUSDC redemption via Maple withdrawal queue"
        target: "${constants.syrupusdc_address}"
        selector: "requestRedeem(uint256,address)"
        parameters:
          - type: "uint256"
            value: "${returns.syrupusdc_delta}"
          - type: "address"
            value: "${returns.caliber_address}"

      # ---- Attribution: paired KV writes, same delta, same action ----------
      # wP and wT MUST move by the same amount. If wT ever drifts below the sum
      # of the weights, the escrow is over-counted again — see
      # tests/test_maple_escrow_prorate.py:test_broken_invariant_wt_too_low_inflates.
      - description: "Read this position's current escrow weight"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_position_key}"
        return:
          name: "position_weight_before"
          type: "uint256"

      - description: "Position weight += requested shares (Maple accumulates the same way)"
        target: "${constants.unsigned_math_helper_address}"
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.position_weight_before}"
          - type: "uint256"
            value: "${returns.syrupusdc_delta}"
        return:
          name: "position_weight_after"
          type: "uint256"

      - description: "Persist this position's escrow weight"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_position_key}"
          - type: "uint256"
            value: "${returns.position_weight_after}"

      - description: "Read the shared cumulative total for this withdrawal manager"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_total_key}"
        return:
          name: "escrow_total_before"
          type: "uint256"

      - description: "Shared total += requested shares (SAME delta as the position weight)"
        target: "${constants.unsigned_math_helper_address}"
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.escrow_total_before}"
          - type: "uint256"
            value: "${returns.syrupusdc_delta}"
        return:
          name: "escrow_total_after"
          type: "uint256"

      - description: "Persist the shared cumulative total"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_total_key}"
          - type: "uint256"
            value: "${returns.escrow_total_after}"

    input_slots:
      bps_to_redeem:
        type: "uint256"
        description: "Basis points of JT shares to redeem (10000 = 100%)"

  # --------------------------------------------------------------------------
  # Reconcile: drop this position's weight once the queue is fully drained.
  # Guarded on userEscrowedShares(caliber) == 0, which makes the action
  # value-neutral (with E == 0 every term is already 0) so it cannot trip
  # _managePosition's maxPositionDecreaseLossBps check. Releasing while other
  # escrow is still pending would drop this position's phantom term in one step
  # and very likely revert. Skipping the reconcile is NAV-safe — it only
  # restores exact per-position attribution.
  # --------------------------------------------------------------------------
  release_maple_escrow_weight:
    calls:
      - description: "Get caliber's address"
        target: ${constants.context_helper_address}
        selector: "msgSender()"
        parameters: []
        return:
          name: "caliber_address"
          type: "address"

      - description: "Read the caliber's aggregate escrowed shares"
        target: "${constants.withdrawal_manager_address}"
        selector: "userEscrowedShares(address)"
        parameters:
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "escrowed_shares"
          type: "uint256"

      - description: "Check the queue is fully drained for this caliber"
        target: "${constants.caliber_helper_address}"
        selector: "eq(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.escrowed_shares}"
          - type: "uint256"
            value: "0"
        return:
          name: "escrow_is_zero"
          type: "bool"

      - description: "Revert unless drained — releasing early would move position values"
        target: "${constants.boolean_helper_address}"
        selector: "revertIfFalse(bool)"
        parameters:
          - type: "bool"
            value: "${returns.escrow_is_zero}"

      - description: "Read this position's escrow weight"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_position_key}"
        return:
          name: "position_weight"
          type: "uint256"

      - description: "Zero this position's escrow weight"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_position_key}"
          - type: "uint256"
            value: "0"

      - description: "Read the shared cumulative total"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_total_key}"
        return:
          name: "escrow_total_before"
          type: "uint256"

      - description: "Shared total -= this position's weight. sub(a, b) = a - b on 0x3D623B19…, so pass (total, weight)"
        target: "${constants.unsigned_math_helper_address}"
        selector: "sub(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.escrow_total_before}"
          - type: "uint256"
            value: "${returns.position_weight}"
        return:
          name: "escrow_total_after"
          type: "uint256"

      - description: "Persist the shared cumulative total"
        target: "${inputs.kv_store_address}"
        selector: "set(bytes32,bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_total_key}"
          - type: "uint256"
            value: "${returns.escrow_total_after}"
