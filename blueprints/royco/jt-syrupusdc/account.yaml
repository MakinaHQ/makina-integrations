protocol: "royco-jt-syrupusdc"

# Royco Junior Tranche syrupUSDC Account Blueprint (USDC-denominated)
# Sums caliber's exposure in syrupUSDC space, then converts ONCE to USDC via
# syrupUSDC.convertToExitAssets. Mirrors blueprints/royco/st-syrupusdc/account.yaml;
# only the tranche address differs.
#
# DOUBLE-COUNTING — SOLVED by per-position attribution (design A).
# Maple_WithdrawalManager.userEscrowedShares is keyed on the caliber, not on
# which position fed the queue, and accumulates per OWNER. So ONE pending
# withdrawal used to be counted by EVERY position on that caliber reading this
# manager — the ST tranche, and (on dusd) the syrupUSDC/RLUSD Morpho loop via
# blueprints/morpho-loop/maple/account-equity.yaml. Simultaneity was not
# required for the double count.
#
# This blueprint now books only its own prorated share, using the caliber's KV
# store. The scheme, the `wT == sum(wP)` invariant and the per-withdrawal-manager
# key namespacing are documented in
# blueprints/morpho-loop/maple/withdraw-maple-redeem-attributed.yaml; branch
# coverage is in tests/test_maple_escrow_prorate.py. Because the LIVE aggregate
# is the multiplicand, a stale weight misattributes between positions but cannot
# inflate NAV, and settlement self-clears every term.
# Design note: docs/superpowers/specs/2026-05-08-royco-junior-tranches-design.md.
#
# Components:
#   1. Active JT position: JT.convertToAssets(jt_shares) -> (stAssets, jtAssets, nav)
#      Both stAssets and jtAssets are in TRANCHE_UNIT = syrupUSDC (6 dec) and both are
#      populated for JT (kernel distributes pro-rata claim across both accumulators).
#   2. This position's share of the pending Maple withdrawal:
#      mulDiv(WM.userEscrowedShares(caliber), KV[position_key], max(KV[total_key], 1))
#      (syrupUSDC, 6 dec)
#   3. total_syrup = stAssets + jtAssets + escrowed_syrup
#   4. usdc_value = syrupUSDC.convertToExitAssets(total_syrup)

constants:
  context_helper_address:
    type: "address"
    value: "0x0f431322E1fF2500D4C5a4E090A7Da7344F953BE"
  unsigned_math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"
  bytes32_helper_address:
    type: "address"
    value: "0x74DC739B8F98ad0F76Cd8900695DD8D5083E45D3"
  junior_tranche_address:
    type: "address"
    value: "0x5f340b400f892bbfded2e5c316369dcbf05c282a"
  kernel_address:
    type: "address"
    value: "0xde1Ce2cF64808e50d000F93058784270E412B3A4"
  syrupusdc_address:
    type: "address"
    value: "0x80ac24aA929eaF5013f6436cdA2a7ba190f5Cc0b"
  withdrawal_manager_address:
    type: "address"
    value: "0x1bc47a0Dd0FdaB96E9eF982fdf1F34DC6207cfE3"

inputs:
  # Per-position attribution of the caliber-wide Maple escrow (design A). See
  # blueprints/morpho-loop/maple/withdraw-maple-redeem-attributed.yaml.
  kv_store_address:
    type: "address"
  maple_escrow_position_key:
    type: "bytes32"
  maple_escrow_total_key:
    type: "bytes32"

actions:
  account:
    calls:
      - description: "Get caliber's address"
        target: ${constants.context_helper_address}
        selector: "msgSender()"
        parameters: []
        return:
          name: "caliber_address"
          type: "address"

      - description: "Sync tranche accounting on the market kernel"
        target: "${constants.kernel_address}"
        selector: "syncTrancheAccounting()"
        parameters: []

      - description: "Get Junior Tranche share balance"
        target: "${constants.junior_tranche_address}"
        selector: "balanceOf(address)"
        parameters:
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "jt_shares"
          type: "uint256"

      - description: "Convert JT shares to asset claims (stAssets, jtAssets, nav) scaled to caliber pro-rata"
        target: "${constants.junior_tranche_address}"
        selector: "convertToAssets(uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.jt_shares}"
        return:
          name: "asset_claims"
          type: "(uint256,uint256,uint256)"

      - description: "Extract stAssets (TRANCHE_UNIT = syrupUSDC, 6 dec) from claims tuple"
        target: "${constants.bytes32_helper_address}"
        selector: "getTupleWord(bytes,uint256)"
        parameters:
          - type: "(uint256,uint256,uint256)"
            value: "${returns.asset_claims}"
          - type: "uint256"
            value: "0"
        return:
          name: "active_st_assets"
          type: "uint256"

      - description: "Extract jtAssets (TRANCHE_UNIT = syrupUSDC, 6 dec) from claims tuple"
        target: "${constants.bytes32_helper_address}"
        selector: "getTupleWord(bytes,uint256)"
        parameters:
          - type: "(uint256,uint256,uint256)"
            value: "${returns.asset_claims}"
          - type: "uint256"
            value: "1"
        return:
          name: "active_jt_assets"
          type: "uint256"

      - description: "Get escrowed syrupUSDC shares for the CALIBER (all positions)"
        target: "${constants.withdrawal_manager_address}"
        selector: "userEscrowedShares(address)"
        parameters:
          - type: "address"
            value: "${returns.caliber_address}"
        return:
          name: "escrowed_syrup_aggregate"
          type: "uint256"

      # ---- Take only THIS position's share of that aggregate ---------------
      - description: "Read this position's escrow weight"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_position_key}"
        return:
          name: "escrow_position_weight"
          type: "uint256"

      - description: "Read the shared cumulative escrow total for this withdrawal manager"
        target: "${inputs.kv_store_address}"
        selector: "get(bytes32)"
        parameters:
          - type: "bytes32"
            value: "${inputs.maple_escrow_total_key}"
        return:
          name: "escrow_total_weight"
          type: "uint256"

      - description: "Guard the denominator: mulDiv(x, 0, 0) reverts (Panic 0x12) and idle is the common state"
        target: "${constants.unsigned_math_helper_address}"
        selector: "max(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.escrow_total_weight}"
          - type: "uint256"
            value: "1"
        return:
          name: "escrow_total_weight_safe"
          type: "uint256"

      - description: "This position's escrowed shares = mulDiv(aggregate, my weight, total weight)"
        target: "${constants.unsigned_math_helper_address}"
        selector: "mulDiv(uint256,uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.escrowed_syrup_aggregate}"
          - type: "uint256"
            value: "${returns.escrow_position_weight}"
          - type: "uint256"
            value: "${returns.escrow_total_weight_safe}"
        return:
          name: "escrowed_syrup"
          type: "uint256"

      - description: "Sum active = stAssets + jtAssets"
        target: "${constants.unsigned_math_helper_address}"
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.active_st_assets}"
          - type: "uint256"
            value: "${returns.active_jt_assets}"
        return:
          name: "total_tranche_assets"
          type: "uint256"

      - description: "Sum total_syrup = active + escrowed"
        target: "${constants.unsigned_math_helper_address}"
        selector: "add(uint256,uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.total_tranche_assets}"
          - type: "uint256"
            value: "${returns.escrowed_syrup}"
        return:
          name: "total_syrup"
          type: "uint256"

      - description: "Convert total syrupUSDC to USDC via convertToExitAssets"
        target: "${constants.syrupusdc_address}"
        selector: "convertToExitAssets(uint256)"
        parameters:
          - type: "uint256"
            value: "${returns.total_syrup}"
        return:
          name: "total_usdc"
          type: "uint256"

    reserved_slots:
      - type: "uint256"
        value: "${returns.total_usdc}"
      - type: "uint256"
        value: "${builtins.UINT256_MAX}"
