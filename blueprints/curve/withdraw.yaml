protocol: "curve"

inputs:
  gauge_address:
    type: "address"
  pool_address:
    type: "address"
  receiver_address:
    type: "address"

actions:
  withdraw:
    calls:
      - description: "Withdraw from gauge with rewards claiming"
        target: "${inputs.gauge_address}"
        selector: "withdraw(uint256,address,bool)"
        parameters:
          - type: "uint256"
            value: "${input_slots.amount_to_withdraw}"
          - type: "address"
            value: "${inputs.receiver_address}"
          - type: "bool"
            value: "true"
      - description: "Remove liquidity for one coin from pool"
        target: "${inputs.pool_address}"
        selector: "remove_liquidity_one_coin(uint256,int128,uint256,address)"
        parameters:
          - type: "uint256"
            value: "${input_slots.amount_to_withdraw}"
          - type: "int128"
            value: "${input_slots.coin_index}"
          - type: "uint256"
            value: "${input_slots.minimum_received}"
          - type: "address"
            value: "${inputs.receiver_address}"
    input_slots:
      amount_to_withdraw:
        type: "uint256"
        description: "The amount to withdraw from the gauge"
      coin_index:
        type: "int128"
        description: "Index of the coin to withdraw (0 or 1)"
      minimum_received:
        type: "uint256"
        description: "Minimum amount of tokens to receive"
