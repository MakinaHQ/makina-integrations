# makina-x Morpho Blue market, debt side — borrow and repay.
#
# Reuses the Makina Core blueprints/morpho actions unchanged — see the rationale in
# ./morpho-market-collateral.yaml. The makina-x parallel of ./morpho-market-debt.yaml, minus the
# ACCOUNTING entry: makina-x positions are not NAV-accounted on-chain, so MANAGEMENT-only.
#
# `repay_asset` repays by asset amount. Morpho reverts on over-repay, so a full close-out leaves
# whatever interest accrued between quoting and execution as dust debt, which a second small repay
# clears.
#
# Expected position vars:
#   label:      string   — e.g. "steakEURCV/USDC (0xc498...e5b5)"
#   market_id:  bytes32  — Morpho market identifier
#   loan_token: address  — loan token address
#
# Expected config:
#   safe_address
#   morpho_address
#   caliber_helper_address

# take debt
- is_debt: true
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.loan_token}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho/borrow.yaml:borrow"
    inputs:
      morpho:
        type: "address"
        value: "${config.morpho_address}"
      executor_helper_address:
        type: "address"
        value: "${config.caliber_helper_address}"
      market_id:
        type: "bytes32"
        value: ${position.market_id}
      caliber_address:
        type: "address"
        value: "${config.safe_address}"

# repay asset
- is_debt: true
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - ${position.loan_token}
  instruction:
    label: ${position.label}
    path: "../../../blueprints/morpho/repay.yaml:repay_asset"
    inputs:
      morpho:
        type: "address"
        value: "${config.morpho_address}"
      market_id:
        type: "bytes32"
        value: ${position.market_id}
      executor_helper:
        type: "address"
        value: "${config.caliber_helper_address}"
      loan_token:
        type: "address"
        value: ${position.loan_token}
      caliber_address:
        type: "address"
        value: "${config.safe_address}"
