# Uniswap X direct-fill settlement for one tokenized equity, buffering idle stable inventory
# in Aave v3. The Morpho-buffered sibling is ./fills-morpho.yaml — keep the two diffable.
#
# This template pins the stable leg to config.stable_address, so it is USDC-specific in practice
# even though the blueprint underneath is not. A chain settling in a different stable should
# use a template that passes the stable as a position var, the way the Morpho sibling does.
#
# Expected position vars:
#   label:       string   e.g. "NVDAx"
#   stock_token: address  tokenized equity delivered by or received by the Safe
#
# Expected config:
#   safe_address
#   uniswap_x_reactor
#   aavev3_core_instance
#   stable_address

- name: uniswap_x_buy_stock_with_stable_direct
  is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.USDC}"
    - ${position.stock_token}
  instruction:
    label: ${position.label}
    path: "../../../blueprints-x/uniswap-x/fill.yaml:buy_stock_with_stable_direct"
    inputs:
      reactor:
        type: "address"
        value: "${config.uniswap_x_reactor}"
      aave_pool_instance:
        type: "address"
        value: "${config.aavev3_core_instance}"
      stable:
        type: "address"
        value: "${config.stable_address}"
      safe_address:
        type: "address"
        value: "${config.safe_address}"
      stock_token:
        type: "address"
        value: ${position.stock_token}

