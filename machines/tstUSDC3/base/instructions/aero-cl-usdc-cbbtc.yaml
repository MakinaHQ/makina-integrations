# Staked USDC/cbBTC Aerodrome CL position — earns AERO emissions via gauge.

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.base.USDC}" # USDC
    - "${token_list.base.cbBTC}" # cbBTC
  instruction:
    label: "usdc_cbbtc"
    path: "../../../blueprints/aerodrome-cl/deposit.yaml:swap_and_deposit_cl_and_stake"
    inputs:
      nft_id_storage_key:
        type: "bytes32"
        value: "${keccak256(makina.tstUSDC3.base.aerodrome.0x4e962bb3889bf030368f56810a9c96b83cb3e778)}"
      kv_store_address:
        type: "address"
        value: "${config.kv_store_address}"
      revertable_caliber_helper:
        type: "address"
        value: "${config.revertable_caliber_helper}"
      token_a_address:
        type: "address"
        value: "${token_list.base.USDC}"
      token_b_address:
        type: "address"
        value: "${token_list.base.cbBTC}"
      nft_manager_address:
        type: "address"
        value: "0x827922686190790b37229fd06084350e74485b72"
      cl_pool_address:
        type: "address"
        value: "0x4e962bb3889bf030368f56810a9c96b83cb3e778"
      gauge_address:
        type: "address"
        value: "0x6399ed6725cC163D019aA64FF55b22149D7179A8"
      caliber_address:
