# Unstaked WETH/USDC tickSpacing=50 Aerodrome CL position — earns trading fees instead of AERO emissions.
# Isolated from the staked position (separate KV key, separate lifecycle).

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "0x4200000000000000000000000000000000000006" # WETH
    - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" # USDC
  instruction:
    label: "weth_usdc_50_unstaked"
    path: "../../../blueprints/aerodrome-cl/deposit.yaml:swap_and_deposit_cl"
    inputs:
      nft_id_storage_key:
        type: "bytes32"
        value: "${keccak256(makina.tstUSDC3.base.aerodrome.0x3fe04a59ebd38cf06080a6f60a98d124eb59392a.unstaked)}"
      kv_store_address:
        type: "address"
        value: "${config.kv_store_address}"
      revertable_caliber_helper:
        type: "address"
        value: "${config.revertable_caliber_helper}"
      token_a_address:
        type: "address"
        value: "0x4200000000000000000000000000000000000006"
      token_b_address:
        type: "address"
        value: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      nft_manager_address:
        type: "address"
        value: "0xe1f8cd9AC4e4A65F54f38a5CdAfCA44f6dD68b53"
      cl_pool_address:
        type: "address"
        value: "0x3fe04a59ebd38cf06080a6f60a98d124eb59392a"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
