# Staked WETH/cbBTC Aerodrome CL position — earns AERO emissions via gauge.

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.base.WETH}" # WETH
    - "${token_list.base.cbBTC}" # cbBTC
  instruction:
    label: "weth_cbbtc"
    path: "../../../blueprints/aerodrome-cl/deposit.yaml:swap_and_deposit_cl_and_stake"
    inputs:
      nft_id_storage_key:
        type: "bytes32"
        value: "${keccak256(makina.tstUSDC3.base.aerodrome.0x70acdf2ad0bf2402c957154f944c19ef4e1cbae1)}"
      kv_store_address:
        type: "address"
        value: "${config.kv_store_address}"
      revertable_caliber_helper:
        type: "address"
        value: "${config.revertable_caliber_helper}"
      token_a_address:
        type: "address"
        value: "${token_list.base.WETH}"
      token_b_address:
        type: "address"
        value: "${token_list.base.cbBTC}"
      nft_manager_address:
        type: "address"
        value: "0x827922686190790b37229fd06084350e74485b72"
      cl_pool_address:
