# Unstaked WETH/USDC Aerodrome CL position — earns trading fees instead of AERO emissions.
# Isolated from the staked position (separate KV key, separate lifecycle).

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "0x4200000000000000000000000000000000000006" # WETH
    - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" # USDC
  instruction:
    label: "weth_usdc_unstaked"
    path: "../../../blueprints/aerodrome-cl/deposit.yaml:swap_and_deposit_cl"
    inputs:
      nft_id_storage_key:
        type: "bytes32"
        value: "${keccak256(makina.tstUSDC3.base.aerodrome.0xb2cc224c1c9fee385f8ad6a55b4d94e92359dc59.unstaked)}"
      kv_store_address:
        type: "address"
        value: "${config.kv_store_address}"
      revertable_caliber_helper:
        type: "address"
        value: "${config.revertable_caliber_helper}"
      token_a_address:
        type: "address"
        value: "0x4200000000000000000000000000000000000006"
      token_b_address:
        type: "address"
        value: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      nft_manager_address:
        type: "address"
        value: "0x827922686190790b37229fd06084350e74485b72"
      cl_pool_address:
        type: "address"
        value: "0xb2cc224c1c9fee385f8ad6a55b4d94e92359dc59"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      swap_router:
        type: "address"
        value: "0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5"

