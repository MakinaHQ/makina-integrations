# Venice AI VVV staking on Base
#
# StakingV2 (sVVV) at 0x321b7ff75154472B18EDb199033fF4D116F340Ff
# Underlying VVV at 0xacfE6019Ed1A7Dc6f7B508C02d1b04ec88cC21bf (registered base token)
#
# Flow:
#   stake                       — VVV in, sVVV minted 1:1 to caliber, claims pending rewards
#   initiate_unstake            — burn sVVV (exact amount), start 7-day cooldown (604800s)
#   initiate_unstake_relative   — burn bps/10000 of sVVV balance, start 7-day cooldown
#   finalize_unstake            — after cooldown, VVV returned to caliber
#   claim                       — pull pending VVV rewards (HARVEST)
#   account                     — sVVV.balanceOf + pendingRewards + cooldownAmount, in VVV terms

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.base.VVV}" # VVV
  instruction:
    label: "stake"
    path: "../../../blueprints/venice-staking/deposit.yaml:stake"
    inputs:
      staking_contract_address:
        type: "address"
        value: "0x321b7ff75154472B18EDb199033fF4D116F340Ff"
      venice_token_address:
        type: "address"
        value: "${token_list.base.VVV}"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.base.VVV}" # VVV (pending rewards transferred mid-call)
  instruction:
    label: "initiate_unstake"
    path: "../../../blueprints/venice-staking/withdraw.yaml:initiate_unstake"
    inputs:
      staking_contract_address:
        type: "address"
        value: "0x321b7ff75154472B18EDb199033fF4D116F340Ff"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      math_helper_address:
        type: "address"
        value: "${config.math_helper}"

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.base.VVV}" # VVV (pending rewards transferred mid-call)
  instruction:
    label: "initiate_unstake_relative"
    path: "../../../blueprints/venice-staking/withdraw.yaml:initiate_unstake_relative"
    inputs:
      staking_contract_address:
        type: "address"
        value: "0x321b7ff75154472B18EDb199033fF4D116F340Ff"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      math_helper_address:
        type: "address"
        value: "${config.math_helper}"

- is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.base.VVV}" # VVV
  instruction:
    label: "finalize_unstake"
    path: "../../../blueprints/venice-staking/withdraw.yaml:finalize_unstake"
    inputs:
      staking_contract_address:
        type: "address"
        value: "0x321b7ff75154472B18EDb199033fF4D116F340Ff"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      math_helper_address:
        type: "address"
        value: "${config.math_helper}"

- is_debt: false
  instruction_type: "HARVEST"
  affected_tokens: []
  instruction:
    label: "claim"
    path: "../../../blueprints/venice-staking/harvest.yaml:claim"
    inputs:
      staking_contract_address:
        type: "address"
        value: "0x321b7ff75154472B18EDb199033fF4D116F340Ff"

- is_debt: false
  instruction_type: "ACCOUNTING"
  affected_tokens:
    - "${token_list.base.VVV}" # VVV
  instruction:
    label: "account"
    path: "../../../blueprints/venice-staking/account.yaml:account"
    inputs:
      staking_contract_address:
        type: "address"
        value: "0x321b7ff75154472B18EDb199033fF4D116F340Ff"
      caliber_address:
        type: "address"
        value: "${config.caliber_address}"
      revertable_caliber_helper:
        type: "address"
        value: "${config.revertable_caliber_helper}"
      math_helper_address:
        type: "address"
        value: "${config.math_helper}"
