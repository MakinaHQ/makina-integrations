config:
  safe_address:
    type: "address"
    value: "0x81Aa9DA3b68ef186E34e96FB6Ae9ad16D7715C72"
  makina_lite_module:
    type: "address"
    value: "0xA032aFD73Fd42deb549698f5Ac93E8b373330B09"
  uniswap_x_reactor:
    type: "address"
    value: "0x00000011f84b9aa48e5f8aa8b9897600006289be"
  aavev3_core_instance:
    type: "address"
    value: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
  stable_address:
    type: "address"
    value: ${token_list.mainnet.USDC}

positions:
  # Canonical filler-governed parking — emits uniswapX/park_stable_in_aave/USDC.
  # ONE position per profile, never per stock: parking is keyed by the stable label, so
  # folding it into the per-stock template would emit 11 colliding keys.
  #
  # `label` MUST stay the bare stable symbol "USDC" — it is the last path segment the filler
  # is configured against, so changing it silently unroutes parking.
  #
  # NOTE this position ADDS A LEAF and therefore changes this caliber's instruction root, so
  # activating it requires a Safe-only setAllowedInstrRoot on the mainnet module
  # 0xA032aFD7…0B09. The action/label renames in this release are root-neutral (TOML keys
  # only), but the `usdc_amount` -> `stable_amount` slot rename is NOT: state[i] is
  # keccak256(slot_name). Either way this release needs one activation.
  - id: "1"
    group_id: "0"
    description: "Uniswap X filler — park idle USDC in Aave v3"
    instructions: !include "../../../instructions-x/uniswap-x/park-aave.yaml"
    vars:
      label: "USDC"

  # Aave liquidity sleeve, retained for OPERATOR use outside fills — supply and, crucially,
  # withdraw, which has no canonical filler equivalent. The filler must never submit these
  # automatically; its only parking path is the canonical action above. The overlap between
  # aavev3/add_collateral/USDC here and uniswapX/park_stable_in_aave/USDC is deliberate and
  # mirrors the Morpho carve-out in ../robinhood/caliber.yaml.
  - id: "1"
    group_id: "0"
    description: "Aave v3 USDC inventory — operator liquidity sleeve"
    instructions: !include "./instructions/aave-usdc.yaml"

  - id: "2"
    group_id: "0"
    description: "Uniswap X NVDAx filler settlement"
    instructions: !include "../../../instructions-x/uniswap-x/fills-aave.yaml"
    vars:
      label: "NVDAx"
      stock_token: ${token_list.mainnet.NVDAx}

  - id: "3"
    group_id: "0"
    description: "Uniswap X GOOGLx filler settlement"
