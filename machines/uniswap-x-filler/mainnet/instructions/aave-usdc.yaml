- name: aave_deposit_usdc
  is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.USDC}"
  instruction:
    label: "USDC"
    path: "../../../blueprints/aave/deposit.yaml:add_collateral"
    inputs:
      on_behalf_of:
        type: "address"
        value: "${config.safe_address}"
      asset_address:
        type: "address"
        value: "${config.stable_address}"
      aave_pool_instance:
        type: "address"
        value: "${config.aavev3_core_instance}"

- name: aave_withdraw_usdc
  is_debt: false
  instruction_type: "MANAGEMENT"
  affected_tokens:
    - "${token_list.mainnet.USDC}"
  instruction:
    label: "USDC"
    path: "../../../blueprints/aave/withdraw.yaml:withdraw_collateral"
    inputs:
      to:
        type: "address"
        value: "${config.safe_address}"
      asset_address:
        type: "address"
        value: "${config.stable_address}"
      aave_pool_instance:
        type: "address"
        value: "${config.aavev3_core_instance}"
