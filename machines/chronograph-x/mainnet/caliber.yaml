  # CaliberHelper — a stateless pure weiroll utility (extractElementFromStaticTuple), used by
  # blueprints/morpho to index the tuple returned by idToMarketParams. Nothing about it is
  # Caliber-specific and it is callable by any address, including this Safe (verified on-chain);
  # the name is just the contract's. Fund-wide helper, so it belongs in config per CLAUDE.md.
  caliber_helper_address:
    type: "address"
    value: "0x6E2ED2f457c41F38556Ab0c2b1185cc9e6563d8D"
  unsigned_math_helper_address:
    type: "address"
    value: "0x836C9007DbD73fcFC473190304C72b7E39BaBb91"
  # Morpho VaultV2 liquidity lens — a VaultV2's native maxRedeem() returns 0, so the emergency
  # exit sizes its redeem from this lens, which walks the vault's allocations. Verified live
  # against both steakEURCV and steakUSDC.
  morpho_v2_liquidity_lens_address:
    type: "address"
    value: "0x5171Bc00DA5Fc7Ae1eDe189d88B980cAEfb6c690"

positions:
