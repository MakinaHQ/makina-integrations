# The DCM position belongs to this machine's mainnet spoke.
positions:
  # Claim Merkl rewards accrued by the caliber (Aave V4 / Morpho incentives).
  - id: "777"
    group_id: "0"
    description: "Merkl Harvest"
    instructions: !include "../../../instructions/merkl.yaml"
    vars:
      label: "Merkl"
      merkl_distributor_address: "0x3Ef3D8bA38EBe18DB133cEc108f4D14CE00Dd9Ae"

  # ── Aave V4 Coinbase Stocks: supply USDC (reserve 7) ─────────────
  # Supply-only; no debt on this Spoke, so set_using_as_collateral is unused.
  # pools_db makina_id (debank row; matches codex_core.compute_dialectic_id
  # with pool_id = Spoke, chain = base, protocol = AaveV4, category = lending,
  # supply_tokens = USDC). dialectic_id: 41872ac8d433a5252e8c59b9975f8f6d
  - id: "87101647574430846866903259768416079725"
    group_id: "0"
    description: "AaveV4 Coinbase Stocks Supply USDC"
    instructions: !include "../../../instructions/aavev4-supply.yaml"
    vars:
      label: "USDC"
      asset_address: ${token_list.base.USDC}
      spoke_address: "0x17905db0e4a3514467539956c084180616ae7b8d"
      reserve_id: "7"

  # Morpho VaultV2 vaults. The VaultV2 liquidity lens is not deployed on Base,
  # so these use morpho-vault-v1.yaml (plain ERC4626 legs; the emergency leg
  # redeems the full share balance and can revert if the vault is illiquid).
  - id: "133242423309628000059155946577244883881" # pools_db makina_id
    group_id: "0"
    description: "Morpho Vault Clearstar cbAssets USDC"
    instructions: !include "../../../instructions/morpho-vault-v1.yaml"
    position_tokens: ["0x91C056B6d4311a743614FBc03ac32d4E6A2d3a3c"]
    vars:
      label: "Clearstar cbAssets USDC"
      asset_address: ${token_list.base.USDC}
      vault_address: "0x91C056B6d4311a743614FBc03ac32d4E6A2d3a3c"
  - id: "339164440093907089850736277618641036256" # pools_db makina_id
    group_id: "0"
    description: "Morpho Vault Steakhouse High Yield USDC"
    instructions: !include "../../../instructions/morpho-vault-v1.yaml"
    position_tokens: ["0xbeeff7aE5E00Aae3Db302e4B0d8C883810a58100"]
    vars:
      label: "Steakhouse High Yield USDC"
      asset_address: ${token_list.base.USDC}
