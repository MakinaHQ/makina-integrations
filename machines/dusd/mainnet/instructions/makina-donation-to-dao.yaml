# Historical one-time donation of USDC to the Makina DAO. Executed once and
# removed from the dusd caliber; kept for the record. Repointed at the generic
# one-time-transfer blueprint (token + recipient are now inputs, not constants).

- is_debt: false
  instruction_type: "HARVEST"
  affected_tokens: []
  instruction:
    label: "Makina DUSD USDC Donation to DAO"
    path: "../../../blueprints/makina/one-time-transfer.yaml:one_time_transfer"
    inputs:
      kv_store_address:
        type: "address"
        value: "${config.key_value_store_address}"
      boolean_helper_address:
        type: "address"
        value: "${config.boolean_helper_address}"
      token_address:
        type: "address"
        value: ${token_list.mainnet.USDC}
      recipient_address:
        type: "address"
        value: "0x62244C74e1d09b3D86EF7342d354b5D7770bDE10" # Makina DAO
      transfer_amount:
        type: "uint256"
        value: "104491000000" # 104491 USDC with 6 decimals
      kv_store_key:
        type: "bytes32"
        value: "0x4218545ae204f2b2f79565cca2caea363797213eef9f26c27084be21dbd61a3d" # keccak256("makina.dusd.usdc.donation.done")
