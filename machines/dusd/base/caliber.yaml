# DUSD — Base spoke caliber. Same address as the mainnet caliber (0xd1a1…c1bc, a deterministic
# cross-chain deploy), but a distinct caliber with its own positions and accounting. Accounting
# token: Base USDC.
#
# The loopCUSHY Depositor and Redeemer both have whitelists on. This caliber is whitelisted on
# both (isWhitelistedUser(caliber) = true, checked 2026-10-29); deposit and requestRedeem revert
# if it is removed.
config:
  caliber_address:
    type: "address"
    value: "0xd1a1c248b253f1fc60eacd90777b9a63f8c8c1bc"
  # KeyValueStore(caliber) on Base; caliber() == this caliber. Not the mainnet one
  # (0xa81f…2E91), which has no code here.
  key_value_store_address:
    type: "address"
    value: "0xad13e560211755aEeD1316681778c765711Ac160"
  # Base helpers, as on the other Base calibers (the mainnet addresses have no code here)
  caliber_helper_address:
    type: "address"
    value: "0xC62d6FDC4e77C4d006784bc4805703b37fFCc4b7"
  boolean_helper_address:
    type: "address"
    value: "0x8dc60173F37B34998FD5B2aeF47Dd68C68CC22C4"
  unsigned_math_helper_address:
    type: "address"
    value: "0x3D623B199E290358416415eA7e05B635E442e3c0"

positions:
  # ── Makina loopCUSHY Machine ──────────────────────────────────────
  # Addresses read on-chain: machine.shareToken(), machine.depositor(), machine.redeemer(),
  # machine.accountingToken() == Base USDC. Redeemer minRedeemAmount is 10 shares.
  - id: "16838515939890894484516015112317883749839372139418541994421911323744932191268" # keccak256("makina.base.loopcushy")
    group_id: "0"
    description: "Makina loopCUSHY Machine"
    instructions: !include "../../../instructions/makina.yaml"
    position_tokens: ["0xE4c4AFf51Ad4FfbE8B09A1D3F7430Efd9Ee602FE"] # loopCUSHY share token
    vars:
      label: "loopCUSHY"
      machine_token: "0xE4c4AFf51Ad4FfbE8B09A1D3F7430Efd9Ee602FE"
      machine: "0x29CF13a5D5C16fD7Ca78d7357F16A0F75b0E24F0"
      depositor: "0x79d6c39F8bDC4fCB83cdDf83545C6B53f13Ab7fc"
      redeemer: "0xFb6D2375A07AE6d98C5823b670cB9744Ed7cadc4"
      accounting_token: ${token_list.base.USDC}
      redemption_request_id_key: ${keccak256("makina.base.loopcushy.redemption_request_id")}
      pending_redemption_share_amount_key: ${keccak256("makina.base.loopcushy.pending_redemption_share_amount")}
