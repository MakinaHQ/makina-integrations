  # ── PRIME/PYUSD Morpho market (0x41c4…a3fa) ───────────────────────
  # Own liquidation set -> group_id "2". Leverage is built by composing the
  # PRIME swap-in below with add-collateral/borrow (the dusd pattern); PRIME
  # is NAV-priced with no DEX liquidity, so the generic flash-loan
  # morpho-loop-swap template does not apply to this pair.
  #
  # GO-LIVE PREREQUISITE: PRIME is NOT yet a base token on this caliber
  # (isBaseToken -> false) -> Caliber.addBaseToken(PRIME) from the
  # risk-manager timelock. The OracleRegistry PRIME/USDC route already
  # resolves (1.056933), so no setFeedRoute is needed.
  - id: "37645447233873664515981871938816299267" # pools_db makina_id — market 0x41c4…a3fa PRIME collateral (lending)
