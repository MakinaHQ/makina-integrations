positions:
  # uint128 from the first 16 bytes of sha256("makina.base.bfeederdcm").
  - id: "89389141397253094759523781707743722241"
    group_id: "0"
    description: "Makina Base Feeder DCM"
    instructions: !include "../../../instructions/makina.yaml"
    position_tokens: ["0x7244fE8a06848f0F2BDF77CA109C455472175FBF"]
    vars:
      label: "bfeederdcm"
      machine_token: "0x7244fE8a06848f0F2BDF77CA109C455472175FBF"
      machine: "0x91582e8f7684cB41261BB136C691D82b4EcEDe8A"
      depositor: "0xB9BAFd4ceF6D6D875cF62D9847A703C134f0d57c"
      redeemer: "0x236300916876B7bc96Ff7670a44f8937ce1f8aE6"
      accounting_token: ${token_list.base.USDC}
      redemption_request_id_key: ${keccak256("makina.base.bfeederdcm.redemption_request_id")}
      pending_redemption_share_amount_key: ${keccak256("makina.base.bfeederdcm.pending_redemption_share_amount")}

  # ── Morpho SPCXc/USDC (0xce98...ecf6) ──────────────────────────────
  # Post SPCXc collateral, borrow USDC. Own group_id so the offsetting
  # collateral (+) / debt (-) legs are always valued in the same block.
  #
  # Canonical pool IDs from codex_core.compute_dialectic_id + key_map.
  # Both legs use pool_id = <Morpho Blue address>:lending, chain = base,
  # protocol = Morpho, and position_index = market_id. Categories are
  # lending (collateral) and borrowing (debt); token symbols are excluded.
  # dialectic_id: 971d5021d5081f17c0689a7ebef7cf8f
  - id: "200865629245647587244063307511050522511"
    group_id: "1"
    description: "SPCXc/USDC Morpho Collateral (SPCXc)"
    instructions: !include "../../../instructions/morpho-market-collateral.yaml"
    vars:
      label: "SPCXc/USDC (0xce98...ecf6)"
      market_id: "0xce983b9ee6344e16ebbcc66812f23caafc63ae83fcc14fa29b66c7e69e9cecf6"
      collateral_token: ${token_list.base.SPCXc}
  # dialectic_id: a1a8d5db1fd9fd107baa6ae3b5920f73
  - id: "214882350707676042278893489039007158131"
    group_id: "1"
    description: "SPCXc/USDC Morpho Debt (USDC)"
    instructions: !include "../../../instructions/morpho-market-debt.yaml"
    vars:
      label: "SPCXc/USDC (0xce98...ecf6)"
      market_id: "0xce983b9ee6344e16ebbcc66812f23caafc63ae83fcc14fa29b66c7e69e9cecf6"
      loan_token: ${token_list.base.USDC}
